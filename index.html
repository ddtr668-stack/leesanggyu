<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>법인카드 영수증 DB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 엑셀 서식 및 하이퍼링크 엔진 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; }
    .touch-btn { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen pb-20">

  <!-- 상단 네비게이션 헤더 -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-9 h-9 rounded-xl bg-indigo-50 border border-indigo-100 flex items-center justify-center text-indigo-600 shadow-xs">
          <i data-lucide="credit-card" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-black text-gray-900 leading-tight">법인카드 영수증 DB</h1>
          <p class="hidden sm:block text-[11px] text-gray-400 font-medium">영수증 & 거래명세서 통합 보관함</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <!-- 스피너 분리 래퍼 span 적용 (Lucide 태그 교체 간섭 차단) -->
        <button type="button" id="btnSyncDrive" class="touch-btn bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-2 rounded-lg flex items-center shadow-xs font-semibold">
          <span id="syncSpinner" class="inline-flex mr-1.5"><i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i></span> 동기화
        </button>
        <button type="button" id="btnConfigDrive" class="touch-btn bg-white hover:bg-gray-50 text-gray-700 text-xs px-3 py-2 rounded-lg flex items-center border border-gray-300 shadow-xs font-medium">
          <i data-lucide="settings" class="w-3.5 h-3.5 mr-1.5"></i> 설정
        </button>
        <button type="button" id="btnClearCache" class="touch-btn bg-red-50 hover:bg-red-100 text-red-600 text-xs px-2.5 py-2 rounded-lg border border-red-200 shadow-xs" title="내역 캐시만 초기화">
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- 본문 컨테이너 (1600px 와이드) -->
  <main class="max-w-[1600px] mx-auto px-4 sm:px-6 py-5 space-y-4">
    
    <!-- 요약 대시보드 / 정렬 드롭박스 / 버튼 바 -->
    <div class="bg-white p-4 sm:p-5 rounded-2xl border border-gray-200 shadow-xs flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
      <div class="flex flex-col sm:flex-row sm:items-baseline gap-3 sm:gap-4">
        <div>
          <div class="flex flex-wrap items-center gap-2 mb-1.5">
            <span class="text-xs text-gray-400 font-semibold uppercase tracking-wider" id="amountLabel">총 지출 금액</span>
            
            <select id="selectMonthFilter" class="text-xs font-bold bg-indigo-50 text-indigo-700 border border-indigo-200 rounded-lg px-2.5 py-1 outline-none cursor-pointer">
              <option value="all">전체 기간</option>
            </select>

            <select id="selectDateSort" class="text-xs font-bold bg-white text-gray-700 border border-gray-300 rounded-lg px-2.5 py-1 outline-none shadow-2xs hover:border-indigo-400 cursor-pointer">
              <option value="desc">📅 사용일자 내림차순 (최신순)</option>
              <option value="asc">📅 사용일자 오름차순 (과거순)</option>
            </select>
          </div>
          
          <div class="text-2xl sm:text-3xl font-black text-indigo-600 tracking-tight" id="totalAmountText">0원</div>
        </div>
        <div class="text-xs text-gray-400 font-medium pb-1" id="totalCountText">총 0건</div>
      </div>
      
      <!-- 기능 액션 버튼 바 -->
      <div class="flex items-center flex-wrap gap-2">
        <input type="file" id="inputExcelUpload" accept=".xlsx, .xls, .csv" class="hidden" />
        
        <button type="button" id="btnUploadExcel" class="touch-btn bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl flex items-center shadow-xs">
          <i data-lucide="upload" class="w-4 h-4 mr-1.5"></i> 엑셀 업로드
        </button>
        
        <a id="btnOpenSheetDirect" href="https://drive.google.com/drive/folders/1_Z2iV8nVzn3Qf3-jSFv4altgJNEaOlah" target="_blank" class="touch-btn bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl flex items-center shadow-xs">
          <i data-lucide="external-link" class="w-4 h-4 mr-1.5"></i> 엑셀 시트 열기
        </a>

        <button type="button" id="btnExportExcel" class="touch-btn bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl flex items-center shadow-xs">
          <i data-lucide="file-spreadsheet" class="w-4 h-4 mr-1.5"></i> 엑셀 다운로드
        </button>
        
        <button type="button" id="btnOpenAddModal" class="touch-btn bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl flex items-center shadow-xs">
          <i data-lucide="plus" class="w-4 h-4 mr-1.5"></i> 새 영수증 등록
        </button>
      </div>
    </div>

    <!-- 1. 데스크탑 테이블 뷰 (타이틀 고정 & 여유로운 폭) -->
    <div class="hidden sm:block bg-white rounded-2xl border border-gray-200 shadow-xs overflow-hidden">
      <div class="overflow-x-auto overflow-y-auto max-h-[calc(100vh-230px)]">
        <table class="w-full text-left border-collapse min-w-[1260px]">
          <thead class="sticky top-0 z-20 bg-indigo-950 text-white shadow-xs">
            <tr class="text-[11px] font-bold uppercase tracking-wider divide-x divide-indigo-900/60">
              <th class="py-3 px-3 w-16 text-center whitespace-nowrap sticky top-0 bg-indigo-950">영수증</th>
              <th class="py-3 px-3 w-16 text-center whitespace-nowrap sticky top-0 bg-indigo-950">명세서</th>
              <th class="py-3 px-4 w-28 whitespace-nowrap sticky top-0 bg-indigo-950">사용일자</th>
              <th class="py-3 px-4 w-52 whitespace-nowrap sticky top-0 bg-indigo-950">사용처</th>
              <th class="py-3 px-4 w-32 text-right whitespace-nowrap sticky top-0 bg-indigo-950">결제금액</th>
              <th class="py-3 px-4 w-28 text-center whitespace-nowrap sticky top-0 bg-indigo-950">계정과목</th>
              <th class="py-3 px-4 w-24 text-center whitespace-nowrap sticky top-0 bg-indigo-950">결제자</th>
              <th class="py-3 px-4 min-w-[260px] whitespace-nowrap sticky top-0 bg-indigo-950">이용목적</th>
              <th class="py-3 px-4 w-44 whitespace-nowrap sticky top-0 bg-indigo-950 text-indigo-200">거래처</th>
              <th class="py-3 px-4 w-20 text-center whitespace-nowrap sticky top-0 bg-indigo-950">관리</th>
            </tr>
          </thead>
          <tbody id="desktopTableBody" class="divide-y divide-gray-100 text-xs font-medium text-gray-700 bg-white">
            <tr>
              <td colspan="10" class="py-12 text-center text-gray-400 font-normal">등록된 내역이 없습니다.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 2. 모바일 카드 뷰 -->
    <div id="mobileCardContainer" class="block sm:hidden space-y-3">
      <div class="p-8 text-center text-gray-400 text-sm bg-white rounded-2xl border border-dashed border-gray-200">
        등록된 내역이 없습니다.
      </div>
    </div>

  </main>

  <!-- 등록 및 수정 모달 -->
  <div id="expenseModal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-xl rounded-2xl shadow-xl overflow-hidden flex flex-col max-h-[94vh]">
      <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
        <h2 id="modalTitle" class="text-base font-bold text-gray-900">영수증 등록</h2>
        <button type="button" id="btnCloseModal" class="touch-btn text-gray-400 hover:text-gray-600 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="expenseForm" class="p-5 space-y-4 overflow-y-auto flex-1">
        <input type="hidden" id="editExpenseId" value="" />

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">사용일자 *</label>
            <input type="date" id="inputDate" required class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">결제 금액 (원) *</label>
            <input type="number" id="inputAmount" placeholder="예: 310200" required class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 outline-none" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">사용처 (가맹점명) *</label>
          <input type="text" id="inputMerchant" placeholder="예: (주)귀뚜라미보일러천안점" required class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="block text-xs font-semibold text-gray-600">계정과목</label>
              <button type="button" id="btnManageCategories" class="text-[10px] text-indigo-600 font-bold hover:underline">과목 관리</button>
            </div>
            <select id="inputCategory" class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 outline-none bg-white"></select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">결제자</label>
            <input type="text" id="inputUser" placeholder="예: 이상규" class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 outline-none" />
          </div>
        </div>

        <div id="newCategoryWrap" class="hidden">
          <label class="block text-xs font-semibold text-indigo-600 mb-1">새 계정과목명 입력</label>
          <input type="text" id="inputNewCategoryName" placeholder="추가할 과목명 입력" class="w-full px-3 py-2 border border-indigo-200 bg-indigo-50/40 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">이용목적</label>
          <input type="text" id="inputPurpose" placeholder="예: 서광레미콘 EHS 자재 부품 구매" class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>

        <!-- 거래처 (자유 입력) -->
        <div class="bg-indigo-50/60 p-3 rounded-xl border border-indigo-100">
          <label class="block text-xs font-bold text-indigo-950 mb-1 flex items-center">
            <i data-lucide="building-2" class="w-3.5 h-3.5 mr-1 text-indigo-600"></i> 거래처 (자유 입력)
          </label>
          <input type="text" id="inputSite" placeholder="예: 서광레미콘, 당진공장, 천안현장 등 자유 입력" class="w-full px-3 py-2 bg-white border border-indigo-200 rounded-lg text-xs focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>

        <!-- 사진 첨부 영역 -->
        <div class="space-y-3 pt-2 border-t border-gray-100">
          <!-- 영수증 -->
          <div class="bg-gray-50/80 p-3 rounded-xl border border-gray-200/80 space-y-2">
            <div class="flex items-center justify-between">
              <label class="text-xs font-bold text-gray-800 flex items-center">
                <i data-lucide="receipt" class="w-3.5 h-3.5 mr-1 text-indigo-600"></i> 영수증 사진
              </label>
              <div class="inline-flex rounded-lg p-0.5 bg-gray-200 text-[11px] font-semibold">
                <button type="button" id="tabReceiptPC" class="px-2.5 py-1 rounded-md bg-white text-indigo-700 shadow-2xs font-bold">💻 내 PC</button>
                <button type="button" id="tabReceiptDrive" class="px-2.5 py-1 rounded-md text-gray-600 hover:text-gray-900">☁️ 구글 드라이브</button>
              </div>
            </div>

            <div id="receiptPCSection">
              <input type="file" id="inputReceiptFile" accept="image/*" class="w-full text-[11px] text-gray-500 file:mr-2 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-[11px] file:font-semibold file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100" />
            </div>

            <div id="receiptDriveSection" class="hidden space-y-1.5">
              <div class="flex space-x-1.5">
                <button type="button" id="btnPickReceiptFromDrive" class="touch-btn bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg flex items-center shrink-0 shadow-2xs">
                  <i data-lucide="folder-search" class="w-3.5 h-3.5 mr-1"></i> 보관함에서 선택
                </button>
                <input type="text" id="inputReceiptDriveUrl" placeholder="또는 구글 드라이브 파일 링크/ID 붙여넣기" class="flex-1 px-2.5 py-1.5 border rounded-lg text-xs outline-none focus:ring-1 focus:ring-indigo-500" />
              </div>
            </div>

            <div id="receiptPreviewWrap" class="mt-2 hidden flex items-center space-x-2">
              <img id="receiptPreviewImg" src="" alt="영수증" class="w-14 h-14 object-cover rounded-lg border shadow-xs" />
              <div class="text-[11px] text-gray-500 truncate flex-1" id="receiptPreviewText">사진 등록됨</div>
              <button type="button" id="btnRemoveReceipt" class="text-xs text-red-500 hover:underline">사진 지우기</button>
            </div>
          </div>

          <!-- 거래명세서 -->
          <div class="bg-gray-50/80 p-3 rounded-xl border border-gray-200/80 space-y-2">
            <div class="flex items-center justify-between">
              <label class="text-xs font-bold text-gray-800 flex items-center">
                <i data-lucide="file-text" class="w-3.5 h-3.5 mr-1 text-emerald-600"></i> 거래명세서 사진
              </label>
              <div class="inline-flex rounded-lg p-0.5 bg-gray-200 text-[11px] font-semibold">
                <button type="button" id="tabStatementPC" class="px-2.5 py-1 rounded-md bg-white text-emerald-700 shadow-2xs font-bold">💻 내 PC</button>
                <button type="button" id="tabStatementDrive" class="px-2.5 py-1 rounded-md text-gray-600 hover:text-gray-900">☁️ 구글 드라이브</button>
              </div>
            </div>

            <div id="statementPCSection">
              <input type="file" id="inputStatementFile" accept="image/*" class="w-full text-[11px] text-gray-500 file:mr-2 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-[11px] file:font-semibold file:bg-emerald-50 file:text-emerald-600 hover:file:bg-emerald-100" />
            </div>

            <div id="statementDriveSection" class="hidden space-y-1.5">
              <div class="flex space-x-1.5">
                <button type="button" id="btnPickStatementFromDrive" class="touch-btn bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg flex items-center shrink-0 shadow-2xs">
                  <i data-lucide="folder-search" class="w-3.5 h-3.5 mr-1"></i> 보관함에서 선택
                </button>
                <input type="text" id="inputStatementDriveUrl" placeholder="또는 구글 드라이브 파일 링크/ID 붙여넣기" class="flex-1 px-2.5 py-1.5 border rounded-lg text-xs outline-none focus:ring-1 focus:ring-emerald-500" />
              </div>
            </div>

            <div id="statementPreviewWrap" class="mt-2 hidden flex items-center space-x-2">
              <img id="statementPreviewImg" src="" alt="명세서" class="w-14 h-14 object-cover rounded-lg border-2 border-emerald-500 shadow-xs" />
              <div class="text-[11px] text-gray-500 truncate flex-1" id="statementPreviewText">명세서 등록됨</div>
              <button type="button" id="btnRemoveStatement" class="text-xs text-red-500 hover:underline">명세서 지우기</button>
            </div>
          </div>
        </div>

        <div class="pt-3 flex space-x-2">
          <button type="button" id="btnCancelModal" class="touch-btn flex-1 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold rounded-xl">취소</button>
          <button type="submit" id="btnSubmitExpense" class="touch-btn flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl shadow-xs">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 구글 드라이브 사진 선택기 팝업 모달 (z-index: 9999 최상단) -->
  <div id="drivePickerModal" style="z-index: 9999;" class="fixed inset-0 bg-black/65 backdrop-blur-xs flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl flex flex-col max-h-[85vh] overflow-hidden border border-gray-200">
      <div class="px-5 py-4 border-b flex items-center justify-between bg-gray-50">
        <div>
          <h3 class="text-sm font-bold text-gray-900 flex items-center">
            <i data-lucide="cloud" class="w-4 h-4 mr-1.5 text-indigo-600"></i> 구글 드라이브 사진 선택
          </h3>
          <p class="text-[11px] text-gray-500" id="drivePickerTargetDesc">사진을 선택해 주세요</p>
        </div>
        <button type="button" id="btnCloseDrivePicker" class="text-gray-400 hover:text-gray-600 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="p-3 border-b bg-white flex items-center space-x-2">
        <div class="relative flex-1">
          <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-2.5 text-gray-400"></i>
          <input type="text" id="inputSearchDriveImages" placeholder="파일명 또는 날짜, 가맹점 검색..." class="w-full pl-8 pr-3 py-1.5 text-xs border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <button type="button" id="btnReloadDriveImages" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs px-3 py-1.5 rounded-lg flex items-center font-semibold">
          <span id="driveImageSpinner" class="inline-flex mr-1"><i data-lucide="refresh-cw" class="w-3 h-3"></i></span> 새로고침
        </button>
      </div>

      <div class="p-4 flex-1 overflow-y-auto min-h-[300px]">
        <div id="driveImagesLoading" class="text-center py-12 text-gray-400 text-xs hidden">
          <div class="animate-spin inline-block w-6 h-6 border-2 border-indigo-600 border-t-transparent rounded-full mb-2"></div>
          <div>구글 드라이브 사진을 불러오는 중입니다...</div>
        </div>
        <div id="driveImagesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>
      </div>
    </div>
  </div>

  <!-- 계정과목 관리 모달 -->
  <div id="categoryManageModal" style="z-index: 9999;" class="fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl p-5 space-y-4">
      <div class="flex items-center justify-between border-b pb-2">
        <h3 class="text-sm font-bold text-gray-900">계정과목 관리</h3>
        <button type="button" id="btnCloseCatModal" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="flex space-x-2">
        <input type="text" id="catManagerInput" placeholder="신규 과목명" class="flex-1 px-3 py-1.5 border rounded-lg text-xs outline-none focus:ring-2 focus:ring-indigo-500" />
        <button type="button" id="btnAddCatFromManager" class="bg-indigo-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg">추가</button>
      </div>
      <div class="max-h-56 overflow-y-auto space-y-1.5 pr-1" id="catManagerList"></div>
    </div>
  </div>

  <!-- 삭제 확인 모달 -->
  <div id="deleteConfirmModal" style="z-index: 9999;" class="fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl p-5 space-y-4">
      <div class="flex items-center space-x-3 text-red-600">
        <i data-lucide="alert-triangle" class="w-6 h-6 shrink-0"></i>
        <h3 class="text-base font-bold text-gray-900">영수증 내역 삭제</h3>
      </div>
      <p class="text-xs text-gray-600">해당 내역을 삭제하시겠습니까? 구글 시트와 드라이브에서 함께 제거됩니다.</p>
      <div class="flex space-x-2 pt-1">
        <button type="button" id="btnCancelDelete" class="touch-btn flex-1 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold rounded-xl">취소</button>
        <button type="button" id="btnConfirmDelete" class="touch-btn flex-1 py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-semibold rounded-xl shadow-xs">삭제하기</button>
      </div>
    </div>
  </div>

  <!-- 설정 모달 -->
  <div id="configModal" style="z-index: 9999;" class="fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-5 space-y-4">
      <div class="flex items-center justify-between border-b pb-2">
        <h3 class="text-sm font-bold text-gray-900">연동 및 바로가기 설정</h3>
        <button type="button" id="btnCloseConfig" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Google Apps Script Web App URL (/exec)</label>
          <input type="url" id="inputDriveUrl" placeholder="https://script.google.com/macros/s/.../exec" class="w-full px-3 py-2 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">엑셀 시트 바로가기 웹 주소 (선택사항)</label>
          <input type="url" id="inputSheetDirectUrl" placeholder="구글 스프레드시트 링크 또는 폴더 주소" class="w-full px-3 py-2 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
      </div>
      <button type="button" id="btnSaveConfig" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl shadow-xs">설정 저장</button>
    </div>
  </div>

  <!-- 토스트 알림 바 -->
  <div id="toast" style="z-index: 10000;" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900/90 text-white text-xs px-4 py-2.5 rounded-full shadow-lg pointer-events-none transition-opacity duration-300 opacity-0 flex items-center space-x-1.5">
    <span id="toastMsg">알림 메시지</span>
  </div>

  <script>
    const DEFAULT_DRIVE_URL = ""; 
    const DEFAULT_SHEET_URL = "https://drive.google.com/drive/folders/1_Z2iV8nVzn3Qf3-jSFv4altgJNEaOlah";
    const STORAGE_KEY = 'corp_card_expenses_v2';
    const DRIVE_URL_KEY = 'corp_card_drive_url';
    const SHEET_DIRECT_KEY = 'corp_card_sheet_url';
    const CATEGORIES_KEY = 'corp_card_custom_categories_v1';

    const BASE_CATEGORIES = ['기타비용', '소모품비', '접대비', '복리후생비', '여비교통비', '차량유지비'];

    let expenses = [];
    let customCategories = [];
    let selectedMonth = 'all';
    let dateSortOrder = 'desc';
    let pendingDeleteId = null;

    let base64ReceiptTemp = '';
    let base64StatementTemp = '';

    let driveImagesCache = [];
    let activePickerTarget = null;

    function getDriveUrl() {
      const stored = localStorage.getItem(DRIVE_URL_KEY);
      if (stored && stored.trim() !== '') return stored.trim();
      return DEFAULT_DRIVE_URL.trim();
    }

    function getSheetDirectUrl() {
      const stored = localStorage.getItem(SHEET_DIRECT_KEY);
      if (stored && stored.trim() !== '') return stored.trim();
      return DEFAULT_SHEET_URL;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      if (!toast || !toastMsg) return;
      toastMsg.innerText = msg;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2300);
    }

    // ★ 스피너 회전 완벽 제어 함수 (태그 분리 및 안전한 회수)
    function setSyncLoading(isLoading) {
      const wrapper = document.getElementById('syncSpinner');
      if (wrapper) {
        if (isLoading) {
          wrapper.classList.add('animate-spin');
        } else {
          wrapper.classList.remove('animate-spin');
        }
      }
      // Lucide가 재구성했을 수 있는 버튼 내부의 모든 잔여 animate-spin 강제 제거
      const syncBtn = document.getElementById('btnSyncDrive');
      if (syncBtn && !isLoading) {
        syncBtn.querySelectorAll('.animate-spin').forEach(el => el.classList.remove('animate-spin'));
      }
    }

    function convertToDirectDriveUrl(input) {
      if (!input || typeof input !== 'string') return '';
      input = input.trim();
      if (input.startsWith('data:image')) return input;
      const match = input.match(/\/d\/([a-zA-Z0-9_-]+)/) || input.match(/id=([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://lh3.googleusercontent.com/d/${match[1]}`;
      }
      if (/^[a-zA-Z0-9_-]{25,}$/.test(input)) {
        return `https://lh3.googleusercontent.com/d/${input}`;
      }
      return input;
    }

    function loadCategories() {
      try {
        const raw = localStorage.getItem(CATEGORIES_KEY);
        customCategories = raw ? JSON.parse(raw) : [...BASE_CATEGORIES];
      } catch (e) {
        customCategories = [...BASE_CATEGORIES];
      }
      autoDetectFrequentCategories();
      updateCategorySelectOptions();
    }

    function saveCategories() {
      try {
        localStorage.setItem(CATEGORIES_KEY, JSON.stringify(customCategories));
      } catch (e) {}
      updateCategorySelectOptions();
    }

    function autoDetectFrequentCategories() {
      const counts = {};
      expenses.forEach(item => {
        if (item.category && item.category !== '기타' && item.category !== '__new__') {
          counts[item.category] = (counts[item.category] || 0) + 1;
        }
      });

      let added = false;
      for (const [cat, count] of Object.entries(counts)) {
        if (count >= 2 && !customCategories.includes(cat)) {
          customCategories.push(cat);
          added = true;
        }
      }
      if (added) saveCategories();
    }

    function updateCategorySelectOptions(selectedVal = '') {
      const select = document.getElementById('inputCategory');
      if (!select) return;
      let html = customCategories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
      html += `<option value="__new__">+ 직접 새 과목 입력...</option>`;
      select.innerHTML = html;
      if (selectedVal && customCategories.includes(selectedVal)) {
        select.value = selectedVal;
      }
    }

    function normalizeExpense(item, index) {
      let amount = 0;
      if (typeof item.amount === 'number') amount = item.amount;
      else if (typeof item.amount === 'string') {
        amount = Number(item.amount.replace(/[^0-9.-]+/g, '')) || 0;
      }

      let date = item.date || '';
      if (typeof date === 'string' && date.length > 10) date = date.substring(0, 10);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) {
        date = new Date().toISOString().substring(0, 10);
      }

      return {
        id: String(item.id || ('exp_' + index + '_' + Date.now())),
        date: date,
        merchant: String(item.merchant || '미입력').trim(),
        amount: amount,
        category: String(item.category || '기타').trim(),
        user: String(item.user || '-').trim(),
        purpose: String(item.purpose || '-').trim(),
        site: String(item.site || '').trim(),
        imageUrl: String(item.imageUrl || '').trim(),
        statementUrl: String(item.statementUrl || '').trim()
      };
    }

    function loadLocalExpenses() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        expenses = parsed.map((item, idx) => normalizeExpense(item, idx));
      } catch (e) {
        expenses = [];
      }
      autoDetectFrequentCategories();
      updateMonthFilterOptions();
      renderList();
    }

    function saveLocalExpenses() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
      } catch (e) {}
      autoDetectFrequentCategories();
      updateMonthFilterOptions();
      renderList();
    }

    function updateMonthFilterOptions() {
      const select = document.getElementById('selectMonthFilter');
      if (!select) return;

      const months = new Set();
      expenses.forEach(item => {
        if (item.date && item.date.length >= 7) {
          months.add(item.date.substring(0, 7));
        }
      });

      const sortedMonths = Array.from(months).sort().reverse();
      const currentVal = selectedMonth;

      let html = `<option value="all">전체 기간</option>`;
      sortedMonths.forEach(m => {
        html += `<option value="${m}">${m} 합계</option>`;
      });

      select.innerHTML = html;
      if (sortedMonths.includes(currentVal) || currentVal === 'all') {
        select.value = currentVal;
      } else {
        select.value = 'all';
        selectedMonth = 'all';
      }
    }

    document.getElementById('selectMonthFilter').addEventListener('change', (e) => {
      selectedMonth = e.target.value;
      renderList();
    });

    document.getElementById('selectDateSort').addEventListener('change', (e) => {
      dateSortOrder = e.target.value;
      renderList();
    });

    function renderList() {
      const tableBody = document.getElementById('desktopTableBody');
      const cardContainer = document.getElementById('mobileCardContainer');
      const totalAmountText = document.getElementById('totalAmountText');
      const totalCountText = document.getElementById('totalCountText');
      const amountLabel = document.getElementById('amountLabel');

      let filteredExpenses = selectedMonth === 'all' 
        ? [...expenses] 
        : expenses.filter(item => item.date && item.date.startsWith(selectedMonth));

      filteredExpenses.sort((a, b) => {
        const dateA = a.date || '';
        const dateB = b.date || '';
        return dateSortOrder === 'asc' ? dateA.localeCompare(dateB) : dateB.localeCompare(dateA);
      });

      amountLabel.innerText = selectedMonth === 'all' ? '총 지출 금액' : `${selectedMonth} 지출 합계`;

      if (!filteredExpenses || filteredExpenses.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="10" class="py-12 text-center text-gray-400 font-normal">등록된 내역이 없습니다.</td></tr>`;
        cardContainer.innerHTML = `<div class="p-8 text-center text-gray-400 text-sm bg-white rounded-2xl border border-dashed border-gray-200">등록된 내역이 없습니다.</div>`;
        totalAmountText.innerText = '0원';
        totalCountText.innerText = '총 0건';
        if (window.lucide) lucide.createIcons();
        return;
      }

      let total = 0;

      const tableHtml = filteredExpenses.map(item => {
        const amt = Number(item.amount) || 0;
        total += amt;

        const receiptCell = item.imageUrl
          ? `<a href="${item.imageUrl}" target="_blank" class="block w-9 h-9 rounded-lg overflow-hidden border border-indigo-200 hover:opacity-80 transition mx-auto shadow-2xs" title="영수증 원본"><img src="${item.imageUrl}" class="w-full h-full object-cover" alt="영수증" /></a>`
          : `<div class="w-9 h-9 rounded-lg bg-gray-50 border border-gray-200 flex items-center justify-center text-gray-300 mx-auto"><i data-lucide="receipt" class="w-4 h-4"></i></div>`;

        const statementCell = item.statementUrl
          ? `<a href="${item.statementUrl}" target="_blank" class="block w-9 h-9 rounded-lg overflow-hidden border-2 border-emerald-500 hover:opacity-80 transition mx-auto shadow-2xs" title="명세서 원본"><img src="${item.statementUrl}" class="w-full h-full object-cover" alt="명세서" /></a>`
          : `<div class="w-9 h-9 rounded-lg bg-gray-50 border border-gray-200 flex items-center justify-center text-gray-300 mx-auto"><i data-lucide="file-text" class="w-4 h-4"></i></div>`;

        const siteCell = item.site 
          ? `<span class="bg-indigo-50 text-indigo-900 font-semibold px-2.5 py-1 rounded border border-indigo-100 whitespace-nowrap inline-block" title="${item.site}">${item.site}</span>`
          : `<span class="text-gray-300">-</span>`;

        return `
          <tr class="hover:bg-indigo-50/40 transition border-b border-gray-100">
            <td class="py-3 px-2 text-center whitespace-nowrap">${receiptCell}</td>
            <td class="py-3 px-2 text-center whitespace-nowrap">${statementCell}</td>
            <td class="py-3 px-4 font-semibold text-gray-600 whitespace-nowrap">${item.date || '-'}</td>
            <td class="py-3 px-4 font-bold text-gray-900 whitespace-nowrap">${item.merchant || '미입력'}</td>
            <td class="py-3 px-4 text-right font-black text-indigo-600 text-sm whitespace-nowrap">${amt.toLocaleString()}원</td>
            <td class="py-3 px-4 text-center whitespace-nowrap">
              <span class="bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-md text-[11px] font-bold border border-indigo-100/60 whitespace-nowrap inline-block">${item.category || '기타'}</span>
            </td>
            <td class="py-3 px-4 text-center text-gray-500 whitespace-nowrap">${item.user || '-'}</td>
            <td class="py-3 px-4 text-gray-700 max-w-sm truncate" title="${item.purpose || ''}">${item.purpose || '-'}</td>
            <td class="py-3 px-4 whitespace-nowrap">${siteCell}</td>
            <td class="py-3 px-4 text-center whitespace-nowrap">
              <div class="flex items-center justify-center space-x-1.5">
                <button type="button" class="btn-item-edit p-1.5 text-gray-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition" data-id="${item.id}" title="수정">
                  <i data-lucide="pencil" class="w-4 h-4 pointer-events-none"></i>
                </button>
                <button type="button" class="btn-item-delete p-1.5 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition" data-id="${item.id}" title="삭제">
                  <i data-lucide="trash-2" class="w-4 h-4 pointer-events-none"></i>
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      const cardHtml = filteredExpenses.map(item => {
        const amt = Number(item.amount) || 0;
        const imgTag = item.imageUrl 
          ? `<a href="${item.imageUrl}" target="_blank" class="block shrink-0"><img src="${item.imageUrl}" class="w-16 h-16 rounded-xl object-cover border border-gray-200" alt="영수증" /></a>` 
          : `<div class="w-16 h-16 rounded-xl bg-gray-50 border border-gray-200 flex items-center justify-center text-gray-300 shrink-0"><i data-lucide="receipt" class="w-6 h-6"></i></div>`;

        return `
          <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-xs flex items-start justify-between space-x-3">
            <div class="flex items-start space-x-3 min-w-0">
              ${imgTag}
              <div class="space-y-0.5 min-w-0">
                <div class="flex items-center space-x-1.5">
                  <span class="text-[11px] text-gray-400 font-medium">${item.date || ''}</span>
                  <span class="text-[10px] bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded font-bold whitespace-nowrap">${item.category || '기타'}</span>
                </div>
                <h3 class="text-sm font-bold text-gray-900 truncate">${item.merchant || '미입력'}</h3>
                <p class="text-xs text-gray-500 truncate">${item.purpose || '-'}</p>
                ${item.site ? `<div class="text-[11px] text-indigo-700 font-bold flex items-center pt-0.5"><i data-lucide="building-2" class="w-3.5 h-3.5 mr-1 inline"></i>${item.site}</div>` : ''}
                <div class="text-sm font-black text-indigo-600 pt-0.5">${amt.toLocaleString()}원</div>
              </div>
            </div>
            <div class="flex flex-col space-y-1.5 shrink-0">
              <button type="button" class="btn-item-edit touch-btn bg-gray-100 text-gray-700 text-xs px-2.5 py-1.5 rounded-lg font-bold flex items-center" data-id="${item.id}">
                <i data-lucide="pencil" class="w-3.5 h-3.5 mr-1 pointer-events-none"></i>수정
              </button>
              <button type="button" class="btn-item-delete touch-btn bg-red-50 text-red-600 text-xs px-2.5 py-1.5 rounded-lg font-bold flex items-center" data-id="${item.id}">
                <i data-lucide="trash-2" class="w-3.5 h-3.5 mr-1 pointer-events-none"></i>삭제
              </button>
            </div>
          </div>
        `;
      }).join('');

      tableBody.innerHTML = tableHtml;
      cardContainer.innerHTML = cardHtml;

      totalAmountText.innerText = `${total.toLocaleString()}원`;
      totalCountText.innerText = `총 ${filteredExpenses.length}건`;
      if (window.lucide) lucide.createIcons();
    }

    // 탭 전환
    const tabReceiptPC = document.getElementById('tabReceiptPC');
    const tabReceiptDrive = document.getElementById('tabReceiptDrive');
    const receiptPCSection = document.getElementById('receiptPCSection');
    const receiptDriveSection = document.getElementById('receiptDriveSection');

    tabReceiptPC.addEventListener('click', () => {
      tabReceiptPC.className = "px-2.5 py-1 rounded-md bg-white text-indigo-700 shadow-2xs font-bold";
      tabReceiptDrive.className = "px-2.5 py-1 rounded-md text-gray-600 hover:text-gray-900";
      receiptPCSection.classList.remove('hidden');
      receiptDriveSection.classList.add('hidden');
    });

    tabReceiptDrive.addEventListener('click', () => {
      tabReceiptDrive.className = "px-2.5 py-1 rounded-md bg-white text-indigo-700 shadow-2xs font-bold";
      tabReceiptPC.className = "px-2.5 py-1 rounded-md text-gray-600 hover:text-gray-900";
      receiptDriveSection.classList.remove('hidden');
      receiptPCSection.classList.add('hidden');
    });

    const tabStatementPC = document.getElementById('tabStatementPC');
    const tabStatementDrive = document.getElementById('tabStatementDrive');
    const statementPCSection = document.getElementById('statementPCSection');
    const statementDriveSection = document.getElementById('statementDriveSection');

    tabStatementPC.addEventListener('click', () => {
      tabStatementPC.className = "px-2.5 py-1 rounded-md bg-white text-emerald-700 shadow-2xs font-bold";
      tabStatementDrive.className = "px-2.5 py-1 rounded-md text-gray-600 hover:text-gray-900";
      statementPCSection.classList.remove('hidden');
      statementDriveSection.classList.add('hidden');
    });

    tabStatementDrive.addEventListener('click', () => {
      tabStatementDrive.className = "px-2.5 py-1 rounded-md bg-white text-emerald-700 shadow-2xs font-bold";
      tabStatementPC.className = "px-2.5 py-1 rounded-md text-gray-600 hover:text-gray-900";
      statementDriveSection.classList.remove('hidden');
      statementPCSection.classList.add('hidden');
    });

    document.getElementById('inputReceiptFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        base64ReceiptTemp = evt.target.result;
        updateReceiptPreview(base64ReceiptTemp, file.name);
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('inputStatementFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        base64StatementTemp = evt.target.result;
        updateStatementPreview(base64StatementTemp, file.name);
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('inputReceiptDriveUrl').addEventListener('input', (e) => {
      const direct = convertToDirectDriveUrl(e.target.value);
      if (direct) {
        base64ReceiptTemp = direct;
        updateReceiptPreview(direct, '구글 드라이브 링크 연결됨');
      }
    });

    document.getElementById('inputStatementDriveUrl').addEventListener('input', (e) => {
      const direct = convertToDirectDriveUrl(e.target.value);
      if (direct) {
        base64StatementTemp = direct;
        updateStatementPreview(direct, '구글 드라이브 링크 연결됨');
      }
    });

    function updateReceiptPreview(src, text) {
      document.getElementById('receiptPreviewImg').src = src;
      document.getElementById('receiptPreviewText').innerText = text || '사진 등록됨';
      document.getElementById('receiptPreviewWrap').classList.remove('hidden');
    }

    function updateStatementPreview(src, text) {
      document.getElementById('statementPreviewImg').src = src;
      document.getElementById('statementPreviewText').innerText = text || '명세서 등록됨';
      document.getElementById('statementPreviewWrap').classList.remove('hidden');
    }

    document.getElementById('btnRemoveReceipt').addEventListener('click', () => {
      base64ReceiptTemp = '';
      document.getElementById('inputReceiptFile').value = '';
      document.getElementById('inputReceiptDriveUrl').value = '';
      document.getElementById('receiptPreviewWrap').classList.add('hidden');
    });

    document.getElementById('btnRemoveStatement').addEventListener('click', () => {
      base64StatementTemp = '';
      document.getElementById('inputStatementFile').value = '';
      document.getElementById('inputStatementDriveUrl').value = '';
      document.getElementById('statementPreviewWrap').classList.add('hidden');
    });

    // 구글 드라이브 사진 선택기
    const drivePickerModal = document.getElementById('drivePickerModal');
    const driveImagesGrid = document.getElementById('driveImagesGrid');
    const driveImagesLoading = document.getElementById('driveImagesLoading');

    document.getElementById('btnPickReceiptFromDrive').addEventListener('click', () => {
      activePickerTarget = 'receipt';
      document.getElementById('drivePickerTargetDesc').innerText = '영수증으로 사용할 사진을 선택해 주세요.';
      openDriveImagePicker();
    });

    document.getElementById('btnPickStatementFromDrive').addEventListener('click', () => {
      activePickerTarget = 'statement';
      document.getElementById('drivePickerTargetDesc').innerText = '거래명세서로 사용할 사진을 선택해 주세요.';
      openDriveImagePicker();
    });

    document.getElementById('btnCloseDrivePicker').addEventListener('click', () => {
      drivePickerModal.classList.add('hidden');
      activePickerTarget = null;
    });

    document.getElementById('btnReloadDriveImages').addEventListener('click', () => {
      fetchDriveImages(true);
    });

    document.getElementById('inputSearchDriveImages').addEventListener('input', (e) => {
      renderDrivePickerGrid(e.target.value);

    function formatExcelDate(val) {
      if (!val) return '';
      if (val instanceof Date) {
        const y = val.getFullYear();
        const m = String(val.getMonth() + 1).padStart(2, '0');
        const d = String(val.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }
      if (typeof val === 'number') {
        const excelEpoch = new Date(Date.UTC(1899, 11, 30));
        const d = new Date(excelEpoch.getTime() + val * 86400000);
        const y = d.getUTCFullYear();
        const m = String(d.getUTCMonth() + 1).padStart(2, '0');
        const day = String(d.getUTCDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }
      const str = String(val).trim().replace(/\//g, '-').replace(/\./g, '-');
      const match = str.match(/(\d{4})[-](\d{1,2})[-](\d{1,2})/);
      if (match) {
        return `${match[1]}-${match[2].padStart(2, '0')}-${match[3].padStart(2, '0')}`;
      }
      return str.substring(0, 10);
    }

    async function handleExcelUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      showToast('엑셀 파일을 읽고 분석 중입니다...');

      try {
        const buffer = await file.arrayBuffer();
        const workbook = XLSX.read(buffer, { type: 'array', cellDates: true });
        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];
        const rawRows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

        if (!rawRows || rawRows.length < 2) {
          showToast('엑셀에 데이터가 없습니다.');
          e.target.value = '';
          return;
        }

        let headerRowIdx = -1;
        let colMap = { date: -1, merchant: -1, amount: -1, purpose: -1, site: -1 };

        for (let r = 0; r < Math.min(rawRows.length, 5); r++) {
          const row = rawRows[r];
          row.forEach((cell, c) => {
            const text = String(cell).trim().replace(/\s+/g, '');
            if (text.includes('일자') || text.includes('날짜')) colMap.date = c;
            if (text.includes('상대거래처명') || text.includes('사용처') || text.includes('가맹점')) colMap.merchant = c;
            if (text.includes('대변') || text.includes('결제금액') || text.includes('출금액') || text === '금액') colMap.amount = c;
            if (text.includes('적요') || text.includes('이용목적') || text.includes('품목')) colMap.purpose = c;
            if (text === '거래처' || text.includes('현장')) colMap.site = c;
          });

          if (colMap.date !== -1 && (colMap.merchant !== -1 || colMap.amount !== -1)) {
            headerRowIdx = r;
            break;
          }
        }

        if (headerRowIdx === -1) {
          headerRowIdx = 0;
          colMap = { date: 0, merchant: 1, amount: 3, purpose: 4, site: -1 };
        }

        const newItems = [];
        let addedCount = 0;
        let skipCount = 0;

        for (let r = headerRowIdx + 1; r < rawRows.length; r++) {
          const row = rawRows[r];
          if (!row || row.length === 0) continue;

          let rawDate = row[colMap.date];
          let rawMerchant = String(row[colMap.merchant] || '').trim();
          let rawAmount = row[colMap.amount];
          let rawPurpose = String(row[colMap.purpose] || '').trim();
          let rawSite = colMap.site !== -1 ? String(row[colMap.site] || '').trim() : '';

          if (!rawDate && !rawMerchant && !rawAmount) continue;

          const formattedDate = formatExcelDate(rawDate);

          let parsedAmount = 0;
          if (typeof rawAmount === 'number') {
            parsedAmount = rawAmount;
          } else if (typeof rawAmount === 'string') {
            parsedAmount = Number(rawAmount.replace(/[^0-9.-]+/g, '')) || 0;
          }

          if (parsedAmount <= 0 && !rawMerchant) continue;

          let user = '';
          const userMatch = rawPurpose.match(/-\((.*?)\)/) || rawPurpose.match(/\((.*?)\)/);
          if (userMatch && userMatch[1]) {
            user = userMatch[1].trim();
          }

          let category = '기타비용';
          const textToAnalyze = (rawPurpose + ' ' + rawMerchant).toLowerCase();
          if (textToAnalyze.includes('식대') || textToAnalyze.includes('도시락') || textToAnalyze.includes('음료') || textToAnalyze.includes('식당') || textToAnalyze.includes('클럽')) {
            category = '복리후생비';
          } else if (textToAnalyze.includes('접대') || textToAnalyze.includes('미팅')) {
            category = '접대비';
          } else if (textToAnalyze.includes('자재') || textToAnalyze.includes('배관') || textToAnalyze.includes('소모품') || textToAnalyze.includes('튜브')) {
            category = '소모품비';
          } else if (textToAnalyze.includes('교통') || textToAnalyze.includes('주차') || textToAnalyze.includes('코레일') || textToAnalyze.includes('휴게소') || textToAnalyze.includes('대리')) {
            category = '여비교통비';
          } else if (textToAnalyze.includes('차량') || textToAnalyze.includes('주유')) {
            category = '차량유지비';
          }

          const cleanMerchant = rawMerchant.replace(/[\(\)주식회사]/g, '').trim();
          const isExist = expenses.some(exp => {
            const expClean = (exp.merchant || '').replace(/[\(\)주식회사]/g, '').trim();
            const dateMatch = (exp.date === formattedDate);
            const amountMatch = (Number(exp.amount) === parsedAmount);
            const merchantMatch = expClean && cleanMerchant && (expClean.includes(cleanMerchant) || cleanMerchant.includes(expClean));
            return dateMatch && amountMatch && merchantMatch;
          });

          if (isExist) {
            skipCount++;
          } else {
            const newItem = {
              id: 'exp_' + Date.now() + '_' + Math.floor(Math.random() * 10000),
              date: formattedDate,
              merchant: rawMerchant,
              amount: parsedAmount,
              category: category,
              user: user || '-',
              purpose: rawPurpose || '-',
              site: rawSite || '',
              imageUrl: '',
              statementUrl: ''
            };
            newItems.push(newItem);
            addedCount++;
          }
        }

        if (newItems.length > 0) {
          expenses = [...newItems, ...expenses];
          saveLocalExpenses();
          postToDriveBatch(newItems);
          showToast(`엑셀 병합 완료: 신규 ${addedCount}건 추가 (기존 ${skipCount}건 보존)`);
        } else {
          showToast(`모든 내역(${skipCount}건)이 이미 장부에 존재하여 중복 추가되지 않았습니다.`);
        }

      } catch (err) {
        console.error('엑셀 처리 오류:', err);
        showToast('엑셀 파일 분석 중 오류가 발생했습니다.');
      } finally {
        e.target.value = '';
      }
    }

      try {
        const fetchUrl = url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
        const res = await fetch(fetchUrl, {
          method: 'GET',
          redirect: 'follow',
          signal: controller.signal

        clearTimeout(timeoutId);

        const data = await res.json();

        if (Array.isArray(data)) {
          expenses = data.map((item, idx) => normalizeExpense(item, idx));

        if (err.name === 'AbortError') {

        } else {

          l: { Target: item.statementUrl, Tooltip: '클릭 시 거래명세서 원본 열기' },
          s: {
            font: { color: { rgb: '059669' }, underline: true, sz: 9.5, name: '맑은 고딕' },
            fill: { fgColor: { rgb: bgOdd } },
            alignment: { horizontal: 'center', vertical: 'center' },
            border: thinBorder
          }
        } : {
          v: '-',
          t: 's',
          s: {
            font: { color: { rgb: '94A3B8' }, sz: 9.5, name: '맑은 고딕' },
            fill: { fgColor: { rgb: bgOdd } },
            alignment: { horizontal: 'center', vertical: 'center' },
            border: thinBorder
          }
        };

        const row = [
          { v: item.date || '', t: 's', s: { font: { sz: 9.5, name: '맑은 고딕' }, fill: { fgColor: { rgb: bgOdd } }, alignment: { horizontal: 'center', vertical: 'center' }, border: thinBorder } },
          { v: item.merchant || '', t: 's', s: { font: { sz: 9.5, bold: true, name: '맑은 고딕' }, fill: { fgColor: { rgb: bgOdd } }, alignment: { horizontal: 'left', vertical: 'center' }, border: thinBorder } },
          { v: amt, t: 'n', z: '#,##0', s: { font: { sz: 9.5, bold: true, color: { rgb: '4338CA' }, name: '맑은 고딕' }, fill: { fgColor: { rgb: bgOdd } }, alignment: { horizontal: 'right', vertical: 'center' }, border: thinBorder } },
          { v: item.category || '', t: 's', s: { font: { sz: 9.5, name: '맑은 고딕' }, fill: { fgColor: { rgb: bgOdd } }, alignment: { horizontal: 'center', vertical: 'center' }, border: thinBorder } },
          { v: item.user || '', t: 's', s: { font: { sz: 9.5, name: '맑은 고딕' }, fill: { fgColor: { rgb: bgOdd } }, alignment: { horizontal: 'center', vertical: 'center' }, border: thinBorder } },
          { v: item.purpose || '', t: 's', s: { font: { sz: 9.5, name: '맑은 고딕' }, fill: { fgColor: { rgb: bgOdd } }, alignment: { horizontal: 'left', vertical: 'center' }, border: thinBorder } },
          { v: item.site || '', t: 's', s: { font: { sz: 9.5, name: '맑은 고딕' }, fill: { fgColor: { rgb: bgOdd } }, alignment: { horizontal: 'left', vertical: 'center' }, border: thinBorder } },
          receiptCell,
          statementCell
        ];

        dataRows.push(row);
      });

      const worksheet = XLSX.utils.aoa_to_sheet(dataRows);
      worksheet['!cols'] = [
        { wch: 13 },
        { wch: 28 },
        { wch: 15 },
        { wch: 13 },
        { wch: 11 },
        { wch: 34 },
        { wch: 22 },
        { wch: 15 },
        { wch: 15 }
      ];

      const rowHeights = [{ hpt: 26 }];
      for (let i = 0; i < filtered.length; i++) {
        rowHeights.push({ hpt: 22 });
      }
      worksheet['!rows'] = rowHeights;

      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, '영수증내역');

      const fileTag = selectedMonth === 'all' ? '전체' : selectedMonth;
      const filename = `법인카드 영수증_${fileTag}.xlsx`;

      XLSX.writeFile(workbook, filename);
      showToast(`${filename} 깔끔한 스타일로 다운로드 완료`);
    });

    // 신규 모달 열기
    document.getElementById('btnOpenAddModal').addEventListener('click', () => {
      document.getElementById('expenseForm').reset();
      document.getElementById('editExpenseId').value = '';
      document.getElementById('inputSite').value = '';
      base64ReceiptTemp = '';
      base64StatementTemp = '';
      document.getElementById('receiptPreviewWrap').classList.add('hidden');
      document.getElementById('statementPreviewWrap').classList.add('hidden');
      document.getElementById('newCategoryWrap').classList.add('hidden');
      document.getElementById('inputDate').value = new Date().toISOString().substring(0, 10);
      
      tabReceiptPC.click();
      tabStatementPC.click();

      updateCategorySelectOptions();
      document.getElementById('modalTitle').innerText = '새 영수증 등록';
      document.getElementById('expenseModal').classList.remove('hidden');
    });

    document.getElementById('btnCloseModal').addEventListener('click', () => document.getElementById('expenseModal').classList.add('hidden'));
    document.getElementById('btnCancelModal').addEventListener('click', () => document.getElementById('expenseModal').classList.add('hidden'));

    // 설정 모달
    document.getElementById('btnConfigDrive').addEventListener('click', () => {
      document.getElementById('inputDriveUrl').value = getDriveUrl();
      document.getElementById('inputSheetDirectUrl').value = getSheetDirectUrl();
      document.getElementById('configModal').classList.remove('hidden');
    });
    document.getElementById('btnCloseConfig').addEventListener('click', () => document.getElementById('configModal').classList.add('hidden'));
    document.getElementById('btnSaveConfig').addEventListener('click', () => {
      const valDrive = document.getElementById('inputDriveUrl').value.trim();
      const valSheet = document.getElementById('inputSheetDirectUrl').value.trim();
      localStorage.setItem(DRIVE_URL_KEY, valDrive);
      if (valSheet) {
        localStorage.setItem(SHEET_DIRECT_KEY, valSheet);
        document.getElementById('btnOpenSheetDirect').href = valSheet;
      }
      document.getElementById('configModal').classList.add('hidden');
      showToast('설정이 저장되었습니다.');
      document.getElementById('btnSyncDrive').click();
    });

    document.getElementById('btnClearCache').addEventListener('click', () => {
      if (confirm('로컬 내역 캐시를 비우시겠습니까? (연동 설정 주소는 보존됩니다)')) {
        localStorage.removeItem(STORAGE_KEY);
        expenses = [];
        updateMonthFilterOptions();
        renderList();
        showToast('내역 캐시가 초기화되었습니다.');
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('btnOpenSheetDirect').href = getSheetDirectUrl();
      loadCategories();
      loadLocalExpenses();
    });
  </script>
</body>
</html>
