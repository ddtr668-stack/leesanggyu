<script>
    const DEFAULT_DRIVE_URL = ""; 
    const STORAGE_KEY = 'corp_card_expenses_v2';
    const DRIVE_URL_KEY = 'corp_card_drive_url';
    const CATEGORIES_KEY = 'corp_card_custom_categories_v1';

    const BASE_CATEGORIES = ['복리후생비', '소모품비', '기타비용', '여비교통비', '접대비', '차량유지비'];

    let expenses = [];
    let customCategories = [];
    let selectedMonth = 'all';
    let pendingDeleteId = null;
    let tempReceiptImg = '';
    let tempStatementImg = '';

    // 1. 연동 URL 조회
    function getDriveUrl() {
      const stored = localStorage.getItem(DRIVE_URL_KEY);
      if (stored && stored.trim() !== '') return stored.trim();
      return DEFAULT_DRIVE_URL.trim();
    }

    // 2. 토스트 알림
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      if (!toast || !toastMsg) return;
      toastMsg.innerText = msg;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2300);
    }

    // 3. 계정과목 관리 및 2회 이상 사용 품목 자동 편입
    function loadCategories() {
      try {
        const raw = localStorage.getItem(CATEGORIES_KEY);
        customCategories = raw ? JSON.parse(raw) : [...BASE_CATEGORIES];
      } catch (e) {
        customCategories = [...BASE_CATEGORIES];
      }
      autoDetectFrequentCategories();
      updateCategorySelectOptions();
    }

    function saveCategories() {
      try {
        localStorage.setItem(CATEGORIES_KEY, JSON.stringify(customCategories));
      } catch (e) {}
      updateCategorySelectOptions();
    }

    function autoDetectFrequentCategories() {
      const counts = {};
      expenses.forEach(item => {
        if (item.category && item.category !== '기타' && item.category !== '__new__') {
          counts[item.category] = (counts[item.category] || 0) + 1;
        }
      });

      let added = false;
      for (const [cat, count] of Object.entries(counts)) {
        if (count >= 2 && !customCategories.includes(cat)) {
          customCategories.push(cat);
          added = true;
        }
      }
      if (added) saveCategories();
    }

    function updateCategorySelectOptions(selectedVal = '') {
      const select = document.getElementById('inputCategory');
      if (!select) return;
      let html = customCategories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
      html += `<option value="__new__">+ 직접 새 과목 입력...</option>`;
      select.innerHTML = html;
      if (selectedVal && customCategories.includes(selectedVal)) {
        select.value = selectedVal;
      }
    }

    // 4. 열 밀림 자동 보정 및 데이터 정제
    function normalizeExpense(item, index) {
      let rawImage1 = item.imageUrl || '';
      let rawImage2 = item.statementUrl || '';
      
      let imageUrl = '';
      let statementUrl = '';

      // 기존 데이터에 단일 사진만 있고 영수증 칸에 들어가 있던 것은 명세서로 재분류
      if (rawImage1 && !rawImage2) {
        statementUrl = rawImage1;
      } else {
        imageUrl = rawImage1;
        statementUrl = rawImage2;
      }

      // 결제 금액 식별
      let parsedAmount = 0;
      const amountCandidates = [item.user, item.amount, item.purpose];
      for (let cand of amountCandidates) {
        if (cand !== undefined && cand !== null && cand !== '') {
          let num = 0;
          if (typeof cand === 'number') num = cand;
          else if (typeof cand === 'string' && !cand.startsWith('http')) {
            num = Number(cand.replace(/[^0-9.-]+/g, '')) || 0;
          }
          if (num >= 100) {
            parsedAmount = num;
            break;
          }
        }
      }

      // 계정과목 식별
      const standardCats = [...new Set([...customCategories, ...BASE_CATEGORIES, '기타비용', '식대'])];
      let category = '기타';
      const catCandidates = [item.merchant, item.category];
      for (let cand of catCandidates) {
        if (typeof cand === 'string') {
          const match = standardCats.find(c => cand.includes(c));
          if (match) {
            category = match;
            break;
          }
        }
      }

      // 사용처 & 이용 목적 분리
      let combinedText = '';
      if (typeof item.category === 'string' && item.category !== category) {
        combinedText = item.category;
      } else if (typeof item.purpose === 'string' && item.purpose !== '-') {
        combinedText = item.purpose;
      } else if (typeof item.merchant === 'string' && item.merchant !== category) {
        combinedText = item.merchant;
      }

      let merchant = '';
      let purpose = '';

      if (combinedText) {
        const parts = combinedText.trim().split(/\s+/);
        merchant = parts[0];
        purpose = parts.slice(1).join(' ') || combinedText;
      } else {
        merchant = item.merchant || '미입력';
        purpose = item.purpose || '-';
      }

      // 결제자 추출
      let user = '';
      if (typeof item.user === 'string' && isNaN(Number(item.user.replace(/,/g, '')))) {
        user = item.user;
      }

      // 일자 검증
      let date = item.date || '';
      if (typeof date === 'string' && date.length > 10) date = date.substring(0, 10);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) {
        date = new Date().toISOString().substring(0, 10);
      }

      return {
        id: String(item.id || ('exp_' + index + '_' + Date.now())),
        date: date,
        merchant: merchant,
        amount: parsedAmount,
        category: category,
        user: user || '-',
        purpose: purpose,
        imageUrl: imageUrl,
        statementUrl: statementUrl
      };
    }

    // 5. 로컬 스토리지 입출력
    function loadLocalExpenses() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        expenses = parsed.map((item, idx) => normalizeExpense(item, idx));
      } catch (e) {
        expenses = [];
      }
      autoDetectFrequentCategories();
      updateMonthFilterOptions();
      renderList();
    }

    function saveLocalExpenses() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
      } catch (e) {}
      autoDetectFrequentCategories();
      updateMonthFilterOptions();
      renderList();
    }

    // 6. 월별 필터 갱신
    function updateMonthFilterOptions() {
      const select = document.getElementById('selectMonthFilter');
      if (!select) return;

      const months = new Set();
      expenses.forEach(item => {
        if (item.date && item.date.length >= 7) {
          months.add(item.date.substring(0, 7));
        }
      });

      const sortedMonths = Array.from(months).sort().reverse();
      const currentVal = selectedMonth;

      let html = `<option value="all">전체 기간</option>`;
      sortedMonths.forEach(m => {
        html += `<option value="${m}">${m} 합계</option>`;
      });

      select.innerHTML = html;
      if (sortedMonths.includes(currentVal) || currentVal === 'all') {
        select.value = currentVal;
      } else {
        select.value = 'all';
        selectedMonth = 'all';
      }
    }

    document.getElementById('selectMonthFilter').addEventListener('change', (e) => {
      selectedMonth = e.target.value;
      renderList();
    });

    // 7. 목록 렌더링 (데스크탑 테이블 & 모바일 카드 동시 생성)
    function renderList() {
      const tableBody = document.getElementById('desktopTableBody');
      const cardContainer = document.getElementById('mobileCardContainer');
      const totalAmountText = document.getElementById('totalAmountText');
      const totalCountText = document.getElementById('totalCountText');
      const amountLabel = document.getElementById('amountLabel');

      const filteredExpenses = selectedMonth === 'all' 
        ? expenses 
        : expenses.filter(item => item.date && item.date.startsWith(selectedMonth));

      amountLabel.innerText = selectedMonth === 'all' ? '총 지출 금액' : `${selectedMonth} 지출 합계`;

      if (!filteredExpenses || filteredExpenses.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="9" class="py-12 text-center text-gray-400 font-normal">선택된 기간의 내역이 없습니다.</td></tr>`;
        cardContainer.innerHTML = `<div class="p-8 text-center text-gray-400 text-sm bg-white rounded-2xl border border-dashed border-gray-200">선택된 기간의 내역이 없습니다.</div>`;
        totalAmountText.innerText = '0원';
        totalCountText.innerText = '총 0건';
        if (window.lucide) lucide.createIcons();
        return;
      }

      let total = 0;

      // 데스크탑 테이블 뷰
      const tableHtml = filteredExpenses.map(item => {
        const amt = Number(item.amount) || 0;
        total += amt;

        const receiptCell = item.imageUrl
          ? `<a href="${item.imageUrl}" target="_blank" class="block w-9 h-9 rounded-lg overflow-hidden border border-gray-200 hover:opacity-80 transition mx-auto shadow-2xs" title="영수증 원본"><img src="${item.imageUrl}" class="w-full h-full object-cover" alt="영수증" /></a>`
          : `<div class="w-9 h-9 rounded-lg bg-gray-50 border border-gray-200 flex items-center justify-center text-gray-300 mx-auto" title="영수증 없음"><i data-lucide="receipt" class="w-3.5 h-3.5"></i></div>`;

        const statementCell = item.statementUrl
          ? `<a href="${item.statementUrl}" target="_blank" class="block w-9 h-9 rounded-lg overflow-hidden border border-emerald-200 hover:opacity-80 transition mx-auto shadow-2xs" title="거래명세서 원본"><img src="${item.statementUrl}" class="w-full h-full object-cover" alt="명세서" /></a>`
          : `<div class="w-9 h-9 rounded-lg bg-gray-50 border border-gray-200 flex items-center justify-center text-gray-300 mx-auto" title="명세서 없음"><i data-lucide="file-text" class="w-3.5 h-3.5"></i></div>`;

        return `
          <tr class="hover:bg-indigo-50/30 transition border-b border-gray-100">
            <td class="py-3 px-2 text-center">${receiptCell}</td>
            <td class="py-3 px-2 text-center">${statementCell}</td>
            <td class="py-3 px-4 font-semibold text-gray-600 whitespace-nowrap">${item.date || '-'}</td>
            <td class="py-3 px-4 font-bold text-gray-900">${item.merchant || '미입력'}</td>
            <td class="py-3 px-4"><span class="bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-md text-[11px] font-bold border border-indigo-100/60">${item.category || '기타'}</span></td>
            <td class="py-3 px-4 text-gray-600 truncate max-w-xs" title="${item.purpose || ''}">${item.purpose || '-'}</td>
            <td class="py-3 px-4 text-gray-500 whitespace-nowrap">${item.user || '-'}</td>
            <td class="py-3 px-4 text-right font-black text-indigo-600 text-sm whitespace-nowrap">${amt.toLocaleString()}원</td>
            <td class="py-3 px-4 text-center whitespace-nowrap">
              <div class="flex items-center justify-center space-x-1.5">
                <button type="button" class="btn-item-edit p-1.5 text-gray-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition" data-id="${item.id}" title="수정">
                  <i data-lucide="pencil" class="w-4 h-4 pointer-events-none"></i>
                </button>
                <button type="button" class="btn-item-delete p-1.5 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition" data-id="${item.id}" title="삭제">
                  <i data-lucide="trash-2" class="w-4 h-4 pointer-events-none"></i>
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      // 모바일 카드 뷰
      const cardHtml = filteredExpenses.map(item => {
        const amt = Number(item.amount) || 0;
        
        const rImg = item.imageUrl 
          ? `<a href="${item.imageUrl}" target="_blank" class="block shrink-0 relative"><img src="${item.imageUrl}" class="w-14 h-14 rounded-xl object-cover border border-gray-200" alt="영수증" /><span class="absolute bottom-0 right-0 bg-black/60 text-white text-[9px] px-1 rounded-tl">영수증</span></a>`
          : ``;
        const sImg = item.statementUrl
          ? `<a href="${item.statementUrl}" target="_blank" class="block shrink-0 relative"><img src="${item.statementUrl}" class="w-14 h-14 rounded-xl object-cover border border-emerald-300" alt="명세서" /><span class="absolute bottom-0 right-0 bg-emerald-700/80 text-white text-[9px] px-1 rounded-tl">명세서</span></a>`
          : ``;

        return `
          <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-xs flex items-start justify-between space-x-3">
            <div class="flex items-start space-x-2.5 min-w-0">
              <div class="flex space-x-1.5 shrink-0">
                ${rImg || sImg ? `${rImg}${sImg}` : `<div class="w-14 h-14 rounded-xl bg-gray-50 border border-gray-200 flex items-center justify-center text-gray-300"><i data-lucide="receipt" class="w-6 h-6"></i></div>`}
              </div>
              <div class="space-y-0.5 min-w-0">
                <div class="flex items-center space-x-1.5">
                  <span class="text-[11px] text-gray-400 font-medium">${item.date || ''}</span>
                  <span class="text-[10px] bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded font-bold">${item.category || '기타'}</span>
                </div>
                <h3 class="text-sm font-bold text-gray-900 truncate">${item.merchant || '미입력'}</h3>
                <p class="text-xs text-gray-500 truncate">${item.purpose || '-'}</p>
                <div class="text-sm font-black text-indigo-600 pt-0.5">${amt.toLocaleString()}원</div>
              </div>
            </div>
            <div class="flex flex-col space-y-1.5 shrink-0">
              <button type="button" class="btn-item-edit touch-btn bg-gray-100 active:bg-gray-200 text-gray-700 text-xs px-2.5 py-1.5 rounded-lg font-bold flex items-center" data-id="${item.id}">
                <i data-lucide="pencil" class="w-3.5 h-3.5 mr-1 pointer-events-none"></i>수정
              </button>
              <button type="button" class="btn-item-delete touch-btn bg-red-50 active:bg-red-100 text-red-600 text-xs px-2.5 py-1.5 rounded-lg font-bold flex items-center" data-id="${item.id}">
                <i data-lucide="trash-2" class="w-3.5 h-3.5 mr-1 pointer-events-none"></i>삭제
              </button>
            </div>
          </div>
        `;
      }).join('');

      tableBody.innerHTML = tableHtml;
      cardContainer.innerHTML = cardHtml;

      totalAmountText.innerText = `${total.toLocaleString()}원`;
      totalCountText.innerText = `총 ${filteredExpenses.length}건`;
      if (window.lucide) lucide.createIcons();
    }

    // 8. 통합 이벤트 위임 핸들러
    function handleActionClick(e) {
      const editBtn = e.target.closest('.btn-item-edit');
      const deleteBtn = e.target.closest('.btn-item-delete');
      if (!editBtn && !deleteBtn) return;
      if (e.type === 'touchend') e.preventDefault();

      if (editBtn) openEditModal(editBtn.getAttribute('data-id'));
      else if (deleteBtn) openDeleteModal(deleteBtn.getAttribute('data-id'));
    }

    document.getElementById('desktopTableBody').addEventListener('click', handleActionClick);
    const mContainer = document.getElementById('mobileCardContainer');
    mContainer.addEventListener('click', handleActionClick);
    mContainer.addEventListener('touchend', handleActionClick, { passive: false });

    // 9. 수정 모달 열기
    window.openEditModal = function(id) {
      const target = expenses.find(x => String(x.id) === String(id));
      if (!target) return;

      document.getElementById('editExpenseId').value = target.id;
      document.getElementById('inputDate').value = target.date || '';
      document.getElementById('inputMerchant').value = target.merchant || '';
      document.getElementById('inputAmount').value = target.amount || '';
      document.getElementById('inputUser').value = target.user || '';
      document.getElementById('inputPurpose').value = target.purpose || '';

      if (target.category && !customCategories.includes(target.category)) {
        customCategories.push(target.category);
        saveCategories();
      }
      updateCategorySelectOptions(target.category);
      document.getElementById('inputCategory').value = target.category || customCategories[0];
      document.getElementById('newCategoryWrap').classList.add('hidden');

      tempReceiptImg = target.imageUrl || '';
      const rWrap = document.getElementById('receiptPreviewWrap');
      const rImg = document.getElementById('receiptPreviewImg');
      if (tempReceiptImg) {
        rImg.src = tempReceiptImg;
        rWrap.classList.remove('hidden');
      } else {
        rWrap.classList.add('hidden');
      }

      tempStatementImg = target.statementUrl || '';
      const sWrap = document.getElementById('statementPreviewWrap');
      const sImg = document.getElementById('statementPreviewImg');
      if (tempStatementImg) {
        sImg.src = tempStatementImg;
        sWrap.classList.remove('hidden');
      } else {
        sWrap.classList.add('hidden');
      }

      document.getElementById('modalTitle').innerText = '영수증 & 거래명세서 수정';
      document.getElementById('expenseModal').classList.remove('hidden');
    };

    window.openDeleteModal = function(id) {
      pendingDeleteId = id;
      document.getElementById('deleteConfirmModal').classList.remove('hidden');
    };

    // 10. 파일 업로드 리스너
    function setupFileInput(inputId, previewWrapId, previewImgId, onSet) {
      document.getElementById(inputId).addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          onSet(evt.target.result);
          document.getElementById(previewImgId).src = evt.target.result;
          document.getElementById(previewWrapId).classList.remove('hidden');
        };
        reader.readAsDataURL(file);
      });
    }

    setupFileInput('inputReceiptFile', 'receiptPreviewWrap', 'receiptPreviewImg', (val) => tempReceiptImg = val);
    setupFileInput('inputStatementFile', 'statementPreviewWrap', 'statementPreviewImg', (val) => tempStatementImg = val);

    document.getElementById('btnRemoveReceiptImg').addEventListener('click', () => {
      tempReceiptImg = '';
      document.getElementById('inputReceiptFile').value = '';
      document.getElementById('receiptPreviewWrap').classList.add('hidden');
    });
    document.getElementById('btnRemoveStatementImg').addEventListener('click', () => {
      tempStatementImg = '';
      document.getElementById('inputStatementFile').value = '';
      document.getElementById('statementPreviewWrap').classList.add('hidden');
    });

    // 11. 직접 입력 전환
    document.getElementById('inputCategory').addEventListener('change', (e) => {
      const wrap = document.getElementById('newCategoryWrap');
      if (e.target.value === '__new__') {
        wrap.classList.remove('hidden');
        document.getElementById('inputNewCategoryName').focus();
      } else {
        wrap.classList.add('hidden');
      }
    });

    // 12. 계정과목 관리 모달 제어
    function renderCategoryManagerList() {
      const list = document.getElementById('catManagerList');
      list.innerHTML = customCategories.map((cat, idx) => `
        <div class="flex items-center justify-between p-2 bg-gray-50 hover:bg-gray-100 rounded-lg text-xs">
          <span class="font-bold text-gray-800">${cat}</span>
          <button type="button" class="btn-delete-cat text-red-500 hover:text-red-700 p-1" data-index="${idx}" title="삭제">
            <i data-lucide="trash-2" class="w-3.5 h-3.5 pointer-events-none"></i>
          </button>
        </div>
      `).join('');
      if (window.lucide) lucide.createIcons();
    }

    document.getElementById('btnManageCategories').addEventListener('click', () => {
      renderCategoryManagerList();
      document.getElementById('categoryManageModal').classList.remove('hidden');
    });
    document.getElementById('btnCloseCatModal').addEventListener('click', () => {
      document.getElementById('categoryManageModal').classList.add('hidden');
    });
    document.getElementById('btnAddCatFromManager').addEventListener('click', () => {
      const input = document.getElementById('catManagerInput');
      const val = input.value.trim();
      if (!val) return;
      if (!customCategories.includes(val)) {
        customCategories.push(val);
        saveCategories();
        renderCategoryManagerList();
        input.value = '';
        showToast(`'${val}' 과목이 추가되었습니다.`);
      } else {
        showToast('이미 등록되어 있는 과목명입니다.');
      }
    });
    document.getElementById('catManagerList').addEventListener('click', (e) => {
      const delBtn = e.target.closest('.btn-delete-cat');
      if (!delBtn) return;
      const idx = Number(delBtn.getAttribute('data-index'));
      const removed = customCategories.splice(idx, 1);
      saveCategories();
      renderCategoryManagerList();
      showToast(`'${removed}' 과목이 삭제되었습니다.`);
    });

    // 13. 저장 및 수정 시에만 구글 드라이브 동기화
    document.getElementById('expenseForm').addEventListener('submit', (e) => {
      e.preventDefault();

      let categoryVal = document.getElementById('inputCategory').value;
      if (categoryVal === '__new__') {
        const newCat = document.getElementById('inputNewCategoryName').value.trim();
        if (newCat) {
          if (!customCategories.includes(newCat)) {
            customCategories.push(newCat);
            saveCategories();
          }
          categoryVal = newCat;
        } else {
          categoryVal = '기타';
        }
      }

      const editId = document.getElementById('editExpenseId').value;
      const expenseData = {
        id: editId || ('exp_' + Date.now()),
        date: document.getElementById('inputDate').value,
        merchant: document.getElementById('inputMerchant').value.trim(),
        amount: Number(document.getElementById('inputAmount').value) || 0,
        category: categoryVal,
        user: document.getElementById('inputUser').value.trim(),
        purpose: document.getElementById('inputPurpose').value.trim(),
        imageUrl: tempReceiptImg || '',
        statementUrl: tempStatementImg || ''
      };

      if (editId) {
        expenses = expenses.map(x => String(x.id) === String(editId) ? expenseData : x);
        showToast('내역이 수정되었습니다. 드라이브 전송 중...');
      } else {
        expenses.unshift(expenseData);
        showToast('새 내역이 등록되었습니다. 드라이브 전송 중...');
      }

      saveLocalExpenses();
      document.getElementById('expenseModal').classList.add('hidden');
      postToDrive({ action: 'save', expense: expenseData });
    });

    // 14. 삭제 처리 (삭제 시에만 구글 드라이브 동기화)
    document.getElementById('btnConfirmDelete').addEventListener('click', () => {
      if (!pendingDeleteId) return;

      const idToDelete = pendingDeleteId;
      expenses = expenses.filter(x => String(x.id) !== String(idToDelete));
      saveLocalExpenses();

      document.getElementById('deleteConfirmModal').classList.add('hidden');
      showToast('삭제되었습니다. 드라이브 반영 중...');

      postToDrive({ action: 'delete', id: String(idToDelete) });
      pendingDeleteId = null;
    });

    document.getElementById('btnCancelDelete').addEventListener('click', () => {
      document.getElementById('deleteConfirmModal').classList.add('hidden');
      pendingDeleteId = null;
    });

    // 15. 구글 드라이브 비동기 요청 전송
    async function postToDrive(payload) {
      const url = getDriveUrl();
      if (!url) return;
      try {
        await fetch(url, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.warn('드라이브 전송 지연:', err);
      }
    }

    // 16. 수동 [동기화] 버튼 리스너
    document.getElementById('btnSyncDrive').addEventListener('click', async () => {
      const url = getDriveUrl();
      if (!url) {
        showToast('설정 버튼을 눌러 연동 주소를 먼저 등록해주세요.');
        document.getElementById('configModal').classList.remove('hidden');
        return;
      }

      const spinner = document.getElementById('syncSpinner');
      if (spinner) spinner.classList.add('animate-spin');
      showToast('구글 드라이브에서 최신 내역을 동기화 중...');

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 10000);

      try {
        const fetchUrl = url + (url.includes('?') ? '&' : '?') + 'action=get&t=' + Date.now();
        const res = await fetch(fetchUrl, {
          method: 'GET',
          redirect: 'follow',
          signal: controller.signal
        });

        clearTimeout(timeoutId);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        if (Array.isArray(data)) {
          expenses = data.map((item, idx) => normalizeExpense(item, idx));
          saveLocalExpenses();
          showToast(`동기화 완료: ${expenses.length}건을 갱신했습니다.`);
        } else if (data && data.error) {
          showToast('드라이브 오류: ' + data.error);
        } else {
          showToast('데이터 형식이 올바르지 않습니다.');
        }
      } catch (err) {
        clearTimeout(timeoutId);
        if (err.name === 'AbortError') {
          showToast('동기화 시간 초과: 네트워크 상태를 확인하세요.');
        } else {
          console.error(err);
          showToast('동기화 실패: 웹앱 주소 및 권한을 확인하세요.');
        }
      } finally {
        if (spinner) spinner.classList.remove('animate-spin');
      }
    });

    // 17. 엑셀 파일 다운로드
    document.getElementById('btnExportExcel').addEventListener('click', () => {
      const filtered = selectedMonth === 'all' 
        ? expenses 
        : expenses.filter(item => item.date && item.date.startsWith(selectedMonth));

      if (!filtered || filtered.length === 0) {
        showToast('다운로드할 내역이 없습니다.');
        return;
      }

      const rows = filtered.map(item => ({
        '사용일자': item.date || '',
        '사용처': item.merchant || '',
        '결제금액': Number(item.amount) || 0,
        '계정과목': item.category || '',
        '결제자': item.user || '',
        '이용목적': item.purpose || '',
        '영수증링크': item.imageUrl || '',
        '거래명세서링크': item.statementUrl || ''
      }));

      const worksheet = XLSX.utils.json_to_sheet(rows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, '영수증내역');

      const fileTag = selectedMonth === 'all' ? '전체' : selectedMonth;
      const filename = `법인카드 영수증_${fileTag}.xlsx`;

      XLSX.writeFile(workbook, filename);
      showToast(`${filename} 다운로드 완료`);
    });

    // 18. 신규 모달 열기 및 닫기
    document.getElementById('btnOpenAddModal').addEventListener('click', () => {
      document.getElementById('expenseForm').reset();
      document.getElementById('editExpenseId').value = '';
      tempReceiptImg = '';
      tempStatementImg = '';
      document.getElementById('receiptPreviewWrap').classList.add('hidden');
      document.getElementById('statementPreviewWrap').classList.add('hidden');
      document.getElementById('newCategoryWrap').classList.add('hidden');
      document.getElementById('inputDate').value = new Date().toISOString().substring(0, 10);
      updateCategorySelectOptions();
      document.getElementById('modalTitle').innerText = '새 영수증 & 명세서 등록';
      document.getElementById('expenseModal').classList.remove('hidden');
    });

    document.getElementById('btnCloseModal').addEventListener('click', () => {
      document.getElementById('expenseModal').classList.add('hidden');
    });
    document.getElementById('btnCancelModal').addEventListener('click', () => {
      document.getElementById('expenseModal').classList.add('hidden');
    });

    // 19. 설정 모달 제어
    document.getElementById('btnConfigDrive').addEventListener('click', () => {
      document.getElementById('inputDriveUrl').value = getDriveUrl();
      document.getElementById('configModal').classList.remove('hidden');
    });
    document.getElementById('btnCloseConfig').addEventListener('click', () => {
      document.getElementById('configModal').classList.add('hidden');
    });
    document.getElementById('btnSaveDriveUrl').addEventListener('click', () => {
      const val = document.getElementById('inputDriveUrl').value.trim();
      localStorage.setItem(DRIVE_URL_KEY, val);
      document.getElementById('configModal').classList.add('hidden');
      showToast('연동 주소가 저장되었습니다.');
    });

    // 20. 캐시 삭제 제어
    document.getElementById('btnClearCache').addEventListener('click', () => {
      if (confirm('로컬 내역 캐시를 비우시겠습니까? (연동 설정 주소는 보존됩니다)')) {
        localStorage.removeItem(STORAGE_KEY);
        expenses = [];
        updateMonthFilterOptions();
        renderList();
        showToast('내역 캐시가 초기화되었습니다.');
      }
    });

    // 21. 초기 로드 (자동 동기화 없이 로컬 캐시 즉시 표시)
    document.addEventListener('DOMContentLoaded', () => {
      loadCategories();
      loadLocalExpenses();
    });
  </script>
