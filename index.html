<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>법인카드 영수증 DB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; }
    .touch-btn { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen pb-20">

  <!-- 헤더 -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-9 h-9 rounded-xl bg-indigo-50 border border-indigo-100 flex items-center justify-center text-indigo-600 shadow-xs">
          <i data-lucide="credit-card" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-black text-gray-900 leading-tight">법인카드 영수증 DB</h1>
          <p class="hidden sm:block text-[11px] text-gray-400 font-medium">실시간 구글 드라이브 동기화</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button type="button" id="btnSyncDrive" class="touch-btn bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-2 rounded-lg flex items-center shadow-xs font-semibold">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5 mr-1.5" id="syncSpinner"></i> 동기화
        </button>
        <button type="button" id="btnConfigDrive" class="touch-btn bg-white hover:bg-gray-50 text-gray-700 text-xs px-3 py-2 rounded-lg flex items-center border border-gray-300 shadow-xs font-medium">
          <i data-lucide="settings" class="w-3.5 h-3.5 mr-1.5"></i> 설정
        </button>
        <button type="button" id="btnClearCache" class="touch-btn bg-red-50 hover:bg-red-100 text-red-600 text-xs px-2.5 py-2 rounded-lg border border-red-200 shadow-xs" title="내역 캐시만 초기화">
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 영역 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-5">
    
    <!-- 요약 대시보드 및 버튼 바 -->
    <div class="bg-white p-5 rounded-2xl border border-gray-200 shadow-xs flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div class="flex items-baseline space-x-3">
        <div>
          <span class="text-xs text-gray-400 font-semibold uppercase tracking-wider">총 지출 금액</span>
          <div class="text-2xl sm:text-3xl font-black text-indigo-600 tracking-tight" id="totalAmountText">0원</div>
        </div>
        <div class="text-xs text-gray-400 font-medium" id="totalCountText">총 0건</div>
      </div>
      <div class="flex items-center space-x-2">
        <button type="button" id="btnExportExcel" class="touch-btn flex-1 sm:flex-none bg-green-600 hover:bg-green-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl flex items-center justify-center shadow-xs">
          <i data-lucide="file-spreadsheet" class="w-4 h-4 mr-1.5"></i> 엑셀 다운로드
        </button>
        <button type="button" id="btnOpenAddModal" class="touch-btn flex-1 sm:flex-none bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl flex items-center justify-center shadow-xs">
          <i data-lucide="plus" class="w-4 h-4 mr-1.5"></i> 새 영수증 등록
        </button>
      </div>
    </div>

    <!-- 1. 데스크탑 테이블 뷰 (sm 이상) -->
    <div class="hidden sm:block bg-white rounded-2xl border border-gray-200 shadow-xs overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-50 border-b border-gray-200 text-[11px] font-bold text-gray-500 uppercase tracking-wider">
              <th class="py-3.5 px-4 w-16 text-center">영수증</th>
              <th class="py-3.5 px-4 w-28">사용일자</th>
              <th class="py-3.5 px-4 w-44">사용처 (가맹점)</th>
              <th class="py-3.5 px-4 w-32">계정과목</th>
              <th class="py-3.5 px-4">이용 목적 / 품목</th>
              <th class="py-3.5 px-4 w-24">결제자</th>
              <th class="py-3.5 px-4 w-32 text-right">결제 금액</th>
              <th class="py-3.5 px-4 w-28 text-center">관리</th>
            </tr>
          </thead>
          <tbody id="desktopTableBody" class="divide-y divide-gray-100 text-xs font-medium text-gray-700">
            <tr>
              <td colspan="8" class="py-12 text-center text-gray-400 font-normal">등록된 내역이 없습니다.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- 2. 모바일 카드 뷰 (sm 미만) -->
    <div id="mobileCardContainer" class="block sm:hidden space-y-3">
      <div class="p-8 text-center text-gray-400 text-sm bg-white rounded-2xl border border-dashed border-gray-200">
        등록된 영수증 내역이 없습니다.
      </div>
    </div>

  </main>

  <!-- 영수증 등록/수정 모달 -->
  <div id="expenseModal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl overflow-hidden flex flex-col max-h-[92vh]">
      <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
        <h2 id="modalTitle" class="text-base font-bold text-gray-900">영수증 등록</h2>
        <button type="button" id="btnCloseModal" class="touch-btn text-gray-400 hover:text-gray-600 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="expenseForm" class="p-5 space-y-4 overflow-y-auto flex-1">
        <input type="hidden" id="editExpenseId" value="" />

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">사용일자 *</label>
            <input type="date" id="inputDate" required class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 outline-none" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">결제 금액 (원) *</label>
            <input type="number" id="inputAmount" placeholder="예: 15000" required class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 outline-none" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">사용처 (가맹점명) *</label>
          <input type="text" id="inputMerchant" placeholder="예: 서광레미콘" required class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">계정과목</label>
            <select id="inputCategory" class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
              <option value="복리후생비">복리후생비</option>
              <option value="소모품비">소모품비</option>
              <option value="기타비용">기타비용</option>
              <option value="여비교통비">여비교통비</option>
              <option value="접대비">접대비</option>
              <option value="차량유지비">차량유지비</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">결제자/카드</label>
            <input type="text" id="inputUser" placeholder="예: 홍길동" class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 outline-none" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">이용 목적 / 품목</label>
          <input type="text" id="inputPurpose" placeholder="예: EHS 자재 부품 구매" class="w-full px-3 py-2 border rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">영수증 사진</label>
          <input type="file" id="inputReceiptFile" accept="image/*" class="w-full text-xs text-gray-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100" />
          <div id="receiptPreviewWrap" class="mt-3 hidden flex items-center space-x-3">
            <img id="receiptPreviewImg" src="" alt="영수증 미리보기" class="w-20 h-20 object-cover rounded-xl border shadow-xs" />
            <button type="button" id="btnRemoveImage" class="text-xs text-red-500 hover:underline">사진 지우기</button>
          </div>
        </div>

        <div class="pt-3 flex space-x-2">
          <button type="button" id="btnCancelModal" class="touch-btn flex-1 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold rounded-xl">취소</button>
          <button type="submit" id="btnSubmitExpense" class="touch-btn flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl shadow-xs">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 삭제 확인 모달 -->
  <div id="deleteConfirmModal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl p-5 space-y-4">
      <div class="flex items-center space-x-3 text-red-600">
        <i data-lucide="alert-triangle" class="w-6 h-6 shrink-0"></i>
        <h3 class="text-base font-bold text-gray-900">영수증 삭제</h3>
      </div>
      <p class="text-xs text-gray-600">해당 내역을 삭제하시겠습니까? 구글 드라이브와 모바일 모두에서 제거됩니다.</p>
      <div class="flex space-x-2 pt-1">
        <button type="button" id="btnCancelDelete" class="touch-btn flex-1 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold rounded-xl">취소</button>
        <button type="button" id="btnConfirmDelete" class="touch-btn flex-1 py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-semibold rounded-xl shadow-xs">삭제하기</button>
      </div>
    </div>
  </div>

  <!-- 드라이브 설정 모달 -->
  <div id="configModal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-5 space-y-4">
      <div class="flex items-center justify-between border-b pb-2">
        <h3 class="text-sm font-bold text-gray-900">구글 드라이브 Web App 연동 설정</h3>
        <button type="button" id="btnCloseConfig" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Google Apps Script Web App URL (/exec)</label>
        <input type="url" id="inputDriveUrl" placeholder="https://script.google.com/macros/s/.../exec" class="w-full px-3 py-2 border rounded-xl text-xs outline-none focus:ring-2 focus:ring-indigo-500" />
        <p class="text-[11px] text-gray-400 mt-1">※ 주소는 브라우저에 자동 기억되며, [설정 저장]을 누르면 즉시 갱신됩니다.</p>
      </div>
      <button type="button" id="btnSaveDriveUrl" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl shadow-xs">설정 저장</button>
    </div>
  </div>

  <!-- 토스트 알림 바 -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900/90 text-white text-xs px-4 py-2.5 rounded-full shadow-lg pointer-events-none transition-opacity duration-300 opacity-0 z-50 flex items-center space-x-1.5">
    <span id="toastMsg">알림 메시지</span>
  </div>

  <script>
    // ★ 최초 1회 발급받은 주소를 여기에 넣어두면 어떤 기기에서 접속해도 자동 연결됩니다.
    // (비워두어도 한번 입력하면 영구 보존됩니다)
    const DEFAULT_DRIVE_URL = ""; 

    const STORAGE_KEY = 'corp_card_expenses_v2';
    const DRIVE_URL_KEY = 'corp_card_drive_url';

    let expenses = [];
    let pendingDeleteId = null;
    let base64ImageTemp = '';

    // 최종 저장된 드라이브 URL 가져오기
    function getDriveUrl() {
      const stored = localStorage.getItem(DRIVE_URL_KEY);
      if (stored && stored.trim() !== '') return stored.trim();
      return DEFAULT_DRIVE_URL.trim();
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      if (!toast || !toastMsg) return;
      toastMsg.innerText = msg;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2300);
    }

    // 데이터 정제 및 열 밀림 자동 보정
    function normalizeExpense(item, index) {
      let date = item.date || '';
      let merchant = item.merchant || '';
      let amount = item.amount;
      let category = item.category || '기타';
      let user = item.user || '';
      let purpose = item.purpose || '';
      let imageUrl = item.imageUrl || '';

      // URL이 잘못된 필드에 섞여 들어간 경우 분리
      if (!imageUrl) {
        if (typeof purpose === 'string' && purpose.startsWith('http')) {
          imageUrl = purpose;
          purpose = '';
        } else if (typeof user === 'string' && user.startsWith('http')) {
          imageUrl = user;
          user = '';
        }
      }

      // 금액 파싱 (콤마, 원 기호 제거)
      let parsedAmount = 0;
      if (typeof amount === 'number') {
        parsedAmount = amount;
      } else if (typeof amount === 'string') {
        parsedAmount = Number(amount.replace(/[^0-9.-]+/g, '')) || 0;
      }

      return {
        id: String(item.id || ('exp_' + index + '_' + Date.now())),
        date: String(date),
        merchant: String(merchant),
        amount: parsedAmount,
        category: String(category),
        user: String(user),
        purpose: String(purpose),
        imageUrl: String(imageUrl)
      };
    }

    function loadLocalExpenses() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        expenses = parsed.map((item, idx) => normalizeExpense(item, idx));
      } catch (e) {
        expenses = [];
      }
      renderList();
    }

    function saveLocalExpenses() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
      } catch (e) {
        console.error('로컬 저장 실패', e);
      }
      renderList();
    }

    // 데스크탑 표 + 모바일 카드 동시 렌더링
    function renderList() {
      const tableBody = document.getElementById('desktopTableBody');
      const cardContainer = document.getElementById('mobileCardContainer');
      const totalAmountText = document.getElementById('totalAmountText');
      const totalCountText = document.getElementById('totalCountText');

      if (!expenses || expenses.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="8" class="py-12 text-center text-gray-400 font-normal">등록된 내역이 없습니다.</td></tr>`;
        cardContainer.innerHTML = `<div class="p-8 text-center text-gray-400 text-sm bg-white rounded-2xl border border-dashed border-gray-200">등록된 영수증 내역이 없습니다.</div>`;
        totalAmountText.innerText = '0원';
        totalCountText.innerText = '총 0건';
        if (window.lucide) lucide.createIcons();
        return;
      }

      let total = 0;

      // 데스크탑 테이블 행 생성
      const tableHtml = expenses.map(item => {
        const amt = Number(item.amount) || 0;
        total += amt;
        const imgCell = item.imageUrl
          ? `<a href="${item.imageUrl}" target="_blank" class="block w-10 h-10 rounded-lg overflow-hidden border border-gray-200 hover:opacity-80 transition mx-auto shadow-2xs"><img src="${item.imageUrl}" class="w-full h-full object-cover" alt="영수증" /></a>`
          : `<div class="w-10 h-10 rounded-lg bg-gray-50 border border-gray-200 flex items-center justify-center text-gray-300 mx-auto"><i data-lucide="receipt" class="w-4 h-4"></i></div>`;

        return `
          <tr class="hover:bg-indigo-50/30 transition border-b border-gray-100">
            <td class="py-3 px-4 text-center">${imgCell}</td>
            <td class="py-3 px-4 font-semibold text-gray-600 whitespace-nowrap">${item.date || '-'}</td>
            <td class="py-3 px-4 font-bold text-gray-900">${item.merchant || '미입력'}</td>
            <td class="py-3 px-4"><span class="bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-md text-[11px] font-bold border border-indigo-100/60">${item.category || '기타'}</span></td>
            <td class="py-3 px-4 text-gray-600 truncate max-w-xs" title="${item.purpose || ''}">${item.purpose || '-'}</td>
            <td class="py-3 px-4 text-gray-500 whitespace-nowrap">${item.user || '-'}</td>
            <td class="py-3 px-4 text-right font-black text-indigo-600 text-sm whitespace-nowrap">${amt.toLocaleString()}원</td>
            <td class="py-3 px-4 text-center whitespace-nowrap">
              <div class="flex items-center justify-center space-x-1.5">
                <button type="button" class="btn-item-edit p-1.5 text-gray-500 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition" data-id="${item.id}" title="수정">
                  <i data-lucide="pencil" class="w-4 h-4 pointer-events-none"></i>
                </button>
                <button type="button" class="btn-item-delete p-1.5 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition" data-id="${item.id}" title="삭제">
                  <i data-lucide="trash-2" class="w-4 h-4 pointer-events-none"></i>
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');

      // 모바일 카드 생성
      const cardHtml = expenses.map(item => {
        const amt = Number(item.amount) || 0;
        const imgTag = item.imageUrl 
          ? `<a href="${item.imageUrl}" target="_blank" class="block shrink-0"><img src="${item.imageUrl}" class="w-16 h-16 rounded-xl object-cover border border-gray-200" alt="영수증" /></a>` 
          : `<div class="w-16 h-16 rounded-xl bg-gray-50 border border-gray-200 flex items-center justify-center text-gray-300 shrink-0"><i data-lucide="receipt" class="w-6 h-6"></i></div>`;

        return `
          <div class="bg-white p-4 rounded-2xl border border-gray-200 shadow-xs flex items-start justify-between space-x-3">
            <div class="flex items-start space-x-3 min-w-0">
              ${imgTag}
              <div class="space-y-0.5 min-w-0">
                <div class="flex items-center space-x-1.5">
                  <span class="text-[11px] text-gray-400 font-medium">${item.date || ''}</span>
                  <span class="text-[10px] bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded font-bold">${item.category || '기타'}</span>
                </div>
                <h3 class="text-sm font-bold text-gray-900 truncate">${item.merchant || '미입력'}</h3>
                <p class="text-xs text-gray-500 truncate">${item.purpose || '-'}</p>
                <div class="text-sm font-black text-indigo-600 pt-0.5">${amt.toLocaleString()}원</div>
              </div>
            </div>
            <div class="flex flex-col space-y-1.5 shrink-0">
              <button type="button" class="btn-item-edit touch-btn bg-gray-100 active:bg-gray-200 text-gray-700 text-xs px-2.5 py-1.5 rounded-lg font-bold flex items-center" data-id="${item.id}">
                <i data-lucide="pencil" class="w-3.5 h-3.5 mr-1 pointer-events-none"></i>수정
              </button>
              <button type="button" class="btn-item-delete touch-btn bg-red-50 active:bg-red-100 text-red-600 text-xs px-2.5 py-1.5 rounded-lg font-bold flex items-center" data-id="${item.id}">
                <i data-lucide="trash-2" class="w-3.5 h-3.5 mr-1 pointer-events-none"></i>삭제
              </button>
            </div>
          </div>
        `;
      }).join('');

      tableBody.innerHTML = tableHtml;
      cardContainer.innerHTML = cardHtml;

      totalAmountText.innerText = `${total.toLocaleString()}원`;
      totalCountText.innerText = `총 ${expenses.length}건`;
      if (window.lucide) lucide.createIcons();
    }

    // 클릭/터치 통합 바인딩
    function handleActionClick(e) {
      const editBtn = e.target.closest('.btn-item-edit');
      const deleteBtn = e.target.closest('.btn-item-delete');
      if (!editBtn && !deleteBtn) return;

      if (e.type === 'touchend') e.preventDefault();

      if (editBtn) {
        openEditModal(editBtn.getAttribute('data-id'));
      } else if (deleteBtn) {
        openDeleteModal(deleteBtn.getAttribute('data-id'));
      }
    }

    document.getElementById('desktopTableBody').addEventListener('click', handleActionClick);
    const mContainer = document.getElementById('mobileCardContainer');
    mContainer.addEventListener('click', handleActionClick);
    mContainer.addEventListener('touchend', handleActionClick, { passive: false });

    // 수정 모달 열기
    window.openEditModal = function(id) {
      const target = expenses.find(x => String(x.id) === String(id));
      if (!target) {
        showToast('해당 내역을 찾을 수 없습니다.');
        return;
      }

      document.getElementById('editExpenseId').value = target.id;
      document.getElementById('inputDate').value = target.date || '';
      document.getElementById('inputMerchant').value = target.merchant || '';
      document.getElementById('inputAmount').value = target.amount || '';
      document.getElementById('inputCategory').value = target.category || '복리후생비';
      document.getElementById('inputUser').value = target.user || '';
      document.getElementById('inputPurpose').value = target.purpose || '';

      base64ImageTemp = target.imageUrl || '';
      const previewWrap = document.getElementById('receiptPreviewWrap');
      const previewImg = document.getElementById('receiptPreviewImg');
      if (base64ImageTemp) {
        previewImg.src = base64ImageTemp;
        previewWrap.classList.remove('hidden');
      } else {
        previewWrap.classList.add('hidden');
      }

      document.getElementById('modalTitle').innerText = '영수증 내역 수정';
      document.getElementById('expenseModal').classList.remove('hidden');
    };

    window.openDeleteModal = function(id) {
      pendingDeleteId = id;
      document.getElementById('deleteConfirmModal').classList.remove('hidden');
    };

    // 이미지 첨부 처리
    document.getElementById('inputReceiptFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        base64ImageTemp = evt.target.result;
        const previewWrap = document.getElementById('receiptPreviewWrap');
        const previewImg = document.getElementById('receiptPreviewImg');
        previewImg.src = base64ImageTemp;
        previewWrap.classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('btnRemoveImage').addEventListener('click', () => {
      base64ImageTemp = '';
      document.getElementById('inputReceiptFile').value = '';
      document.getElementById('receiptPreviewWrap').classList.add('hidden');
    });

    // 폼 저장 (신규 등록 및 수정)
    document.getElementById('expenseForm').addEventListener('submit', (e) => {
      e.preventDefault();

      const editId = document.getElementById('editExpenseId').value;
      const expenseData = {
        id: editId || ('exp_' + Date.now()),
        date: document.getElementById('inputDate').value,
        merchant: document.getElementById('inputMerchant').value.trim(),
        amount: Number(document.getElementById('inputAmount').value) || 0,
        category: document.getElementById('inputCategory').value,
        user: document.getElementById('inputUser').value.trim(),
        purpose: document.getElementById('inputPurpose').value.trim(),
        imageUrl: base64ImageTemp || ''
      };

      if (editId) {
        expenses = expenses.map(x => String(x.id) === String(editId) ? expenseData : x);
        showToast('내역이 수정되었습니다.');
      } else {
        expenses.unshift(expenseData);
        showToast('새 영수증이 등록되었습니다.');
      }

      saveLocalExpenses();
      document.getElementById('expenseModal').classList.add('hidden');

      postToDrive({ action: 'save', expense: expenseData });
    });

    // 삭제 실행
    document.getElementById('btnConfirmDelete').addEventListener('click', () => {
      if (!pendingDeleteId) return;

      const idToDelete = pendingDeleteId;
      expenses = expenses.filter(x => String(x.id) !== String(idToDelete));
      saveLocalExpenses();

      document.getElementById('deleteConfirmModal').classList.add('hidden');
      showToast('삭제되었습니다.');

      postToDrive({ action: 'delete', id: String(idToDelete) });
      pendingDeleteId = null;
    });

    document.getElementById('btnCancelDelete').addEventListener('click', () => {
      document.getElementById('deleteConfirmModal').classList.add('hidden');
      pendingDeleteId = null;
    });

    // 구글 드라이브 비동기 전송
    async function postToDrive(payload) {
      const url = getDriveUrl();
      if (!url) return;

      try {
        await fetch(url, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.warn('드라이브 전송 지연:', err);
      }
    }

    // 구글 드라이브 전체 동기화 (저장된 주소 자동 사용)
    document.getElementById('btnSyncDrive').addEventListener('click', async () => {
      const url = getDriveUrl();
      if (!url) {
        showToast('설정 버튼을 눌러 연동 주소를 먼저 저장해주세요.');
        document.getElementById('configModal').classList.remove('hidden');
        return;
      }

      const spinner = document.getElementById('syncSpinner');
      if (spinner) spinner.classList.add('animate-spin');
      showToast('구글 드라이브에서 최신 내역을 동기화 중...');

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 10000);

      try {
        const fetchUrl = url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
        const res = await fetch(fetchUrl, {
          method: 'GET',
          redirect: 'follow',
          signal: controller.signal
        });

        clearTimeout(timeoutId);

        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();

        if (Array.isArray(data)) {
          expenses = data.map((item, idx) => normalizeExpense(item, idx));
          saveLocalExpenses();
          showToast(`동기화 완료: ${expenses.length}건을 갱신했습니다.`);
        } else if (data && data.error) {
          showToast('드라이브 오류: ' + data.error);
        } else {
          showToast('데이터 형식이 올바르지 않습니다.');
        }
      } catch (err) {
        clearTimeout(timeoutId);
        if (err.name === 'AbortError') {
          showToast('동기화 시간 초과: 네트워크 상태를 확인하세요.');
        } else {
          console.error(err);
          showToast('동기화 실패: 웹앱 주소 및 배포 권한을 확인하세요.');
        }
      } finally {
        if (spinner) spinner.classList.remove('animate-spin');
      }
    });

    // 엑셀 다운로드
    document.getElementById('btnExportExcel').addEventListener('click', () => {
      if (!expenses || expenses.length === 0) {
        showToast('다운로드할 내역이 없습니다.');
        return;
      }

      const rows = expenses.map(item => ({
        '사용일자': item.date || '',
        '사용처': item.merchant || '',
        '결제금액': Number(item.amount) || 0,
        '계정과목': item.category || '',
        '결제자': item.user || '',
        '이용목적': item.purpose || '',
        '영수증링크': item.imageUrl || ''
      }));

      const worksheet = XLSX.utils.json_to_sheet(rows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, '영수증내역');

      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const filename = `법인카드 영수증_${yyyy}-${mm}.xlsx`;

      XLSX.writeFile(workbook, filename);
      showToast(`${filename} 다운로드 완료`);
    });

    // 신규 등록 모달 열기
    document.getElementById('btnOpenAddModal').addEventListener('click', () => {
      document.getElementById('expenseForm').reset();
      document.getElementById('editExpenseId').value = '';
      base64ImageTemp = '';
      document.getElementById('receiptPreviewWrap').classList.add('hidden');
      document.getElementById('inputDate').value = new Date().toISOString().substring(0, 10);
      document.getElementById('modalTitle').innerText = '새 영수증 등록';
      document.getElementById('expenseModal').classList.remove('hidden');
    });

    document.getElementById('btnCloseModal').addEventListener('click', () => {
      document.getElementById('expenseModal').classList.add('hidden');
    });
    document.getElementById('btnCancelModal').addEventListener('click', () => {
      document.getElementById('expenseModal').classList.add('hidden');
    });

    // 설정 모달 (기존에 저장된 주소를 인풋에 채워서 띄움)
    document.getElementById('btnConfigDrive').addEventListener('click', () => {
      document.getElementById('inputDriveUrl').value = getDriveUrl();
      document.getElementById('configModal').classList.remove('hidden');
    });

    document.getElementById('btnCloseConfig').addEventListener('click', () => {
      document.getElementById('configModal').classList.add('hidden');
    });

    // 설정 저장 시 영구 보관
    document.getElementById('btnSaveDriveUrl').addEventListener('click', () => {
      const val = document.getElementById('inputDriveUrl').value.trim();
      localStorage.setItem(DRIVE_URL_KEY, val);
      document.getElementById('configModal').classList.add('hidden');
      showToast('연동 주소가 저장되었습니다. 자동으로 동기화합니다.');
      document.getElementById('btnSyncDrive').click();
    });

    // 캐시 삭제 (동기화 주소는 보존하고 내역 목록 캐시만 삭제)
    document.getElementById('btnClearCache').addEventListener('click', () => {
      if (confirm('로컬 내역 캐시를 비우시겠습니까? (연동 설정 주소는 그대로 유지됩니다)')) {
        localStorage.removeItem(STORAGE_KEY);
        expenses = [];
        renderList();
        showToast('내역 캐시가 초기화되었습니다. [동기화]를 눌러 다시 불러올 수 있습니다.');
      }
    });

    // 앱 시작 시 자동 로드 및 동기화
    document.addEventListener('DOMContentLoaded', () => {
      loadLocalExpenses();
      if (getDriveUrl()) {
        document.getElementById('btnSyncDrive').click();
      }
    });
  </script>
</body>
</html>
