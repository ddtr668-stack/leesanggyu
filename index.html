<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>법인카드 영수증 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; }
    .touch-btn { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen pb-24">

  <!-- 상단 네비게이션 헤더 -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i data-lucide="receipt" class="w-6 h-6 text-indigo-600"></i>
        <h1 class="text-base font-bold text-gray-900">법인카드 영수증 DB</h1>
      </div>
      <div class="flex items-center space-x-2">
        <button type="button" id="btnSyncDrive" class="touch-btn bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-2.5 py-1.5 rounded-lg flex items-center shadow font-semibold">
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5 mr-1" id="syncSpinner"></i> 동기화
        </button>
        <button type="button" id="btnConfigDrive" class="touch-btn bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs px-2.5 py-1.5 rounded-lg flex items-center border">
          <i data-lucide="settings" class="w-3.5 h-3.5 mr-1"></i> 설정
        </button>
        <button type="button" id="btnClearCache" class="touch-btn bg-red-50 hover:bg-red-100 text-red-600 text-xs px-2 py-1.5 rounded-lg border border-red-200" title="캐시 삭제">
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 본문 영역 -->
  <main class="max-w-4xl mx-auto px-4 py-4 space-y-4">
    <!-- 연동 알림 배너 (URL 미입력 시 표시) -->
    <div id="setupBanner" class="bg-amber-50 border border-amber-200 rounded-xl p-3 flex items-center justify-between hidden">
      <div class="flex items-center space-x-2 text-amber-800 text-xs">
        <i data-lucide="alert-circle" class="w-4 h-4 text-amber-600 shrink-0"></i>
        <span>구글 드라이브 Web App URL이 등록되지 않았습니다.</span>
      </div>
      <button type="button" id="btnBannerSetup" class="touch-btn bg-amber-600 text-white text-xs px-2.5 py-1 rounded-md font-semibold shrink-0">URL 등록</button>
    </div>

    <!-- 집계 및 버튼 영역 -->
    <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex flex-wrap items-center justify-between gap-3">
      <div>
        <span class="text-xs text-gray-500 font-medium">총 지출 금액</span>
        <div class="text-2xl font-black text-indigo-600" id="totalAmountText">0원</div>
        <span class="text-xs text-gray-400" id="totalCountText">총 0건</span>
      </div>
      <div class="flex items-center space-x-2">
        <button type="button" id="btnExportExcel" class="touch-btn bg-green-600 hover:bg-green-700 text-white text-xs font-semibold px-3 py-2 rounded-lg flex items-center shadow">
          <i data-lucide="download" class="w-4 h-4 mr-1.5"></i> 엑셀 다운
        </button>
        <button type="button" id="btnOpenAddModal" class="touch-btn bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-3 py-2 rounded-lg flex items-center shadow">
          <i data-lucide="plus" class="w-4 h-4 mr-1.5"></i> 새 영수증
        </button>
      </div>
    </div>

    <!-- 영수증 카드 목록 컨테이너 -->
    <div id="expenseListContainer" class="space-y-3">
      <div class="p-8 text-center text-gray-400 text-sm bg-white rounded-xl border border-dashed border-gray-300">
        등록된 영수증 내역이 없습니다.
      </div>
    </div>
  </main>

  <!-- 영수증 등록/수정 모달 -->
  <div id="expenseModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-lg rounded-2xl shadow-xl overflow-hidden flex flex-col max-h-[92vh]">
      <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between">
        <h2 id="modalTitle" class="text-base font-bold text-gray-900">영수증 등록</h2>
        <button type="button" id="btnCloseModal" class="touch-btn text-gray-400 hover:text-gray-600 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="expenseForm" class="p-5 space-y-4 overflow-y-auto flex-1">
        <input type="hidden" id="editExpenseId" value="" />

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">사용일자 *</label>
          <input type="date" id="inputDate" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">사용처 (가맹점명) *</label>
          <input type="text" id="inputMerchant" placeholder="예: 스타벅스 강남점" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">결제 금액 (원) *</label>
          <input type="number" id="inputAmount" placeholder="예: 15000" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">계정과목</label>
            <select id="inputCategory" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
              <option value="복리후생비(식대)">복리후생비(식대)</option>
              <option value="접대비">접대비</option>
              <option value="여비교통비">여비교통비</option>
              <option value="소모품비">소모품비</option>
              <option value="차량유지비">차량유지비</option>
              <option value="기타">기타</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">결제자/카드</label>
            <input type="text" id="inputUser" placeholder="예: 홍길동" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">이용 목적 / 비고</label>
          <input type="text" id="inputPurpose" placeholder="예: 거래처 미팅 음료 구입" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">영수증 사진 첨부</label>
          <input type="file" id="inputReceiptFile" accept="image/*" class="w-full text-xs text-gray-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100" />
          <div id="receiptPreviewWrap" class="mt-2.5 hidden flex items-center space-x-2">
            <img id="receiptPreviewImg" src="" alt="영수증 미리보기" class="w-20 h-20 object-cover rounded-lg border shadow-sm" />
            <button type="button" id="btnRemoveImage" class="text-xs text-red-500 hover:underline">사진 삭제</button>
          </div>
        </div>

        <div class="pt-3 flex space-x-2">
          <button type="button" id="btnCancelModal" class="touch-btn flex-1 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-semibold rounded-lg">취소</button>
          <button type="submit" id="btnSubmitExpense" class="touch-btn flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold rounded-lg shadow">저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 삭제 확인 모달 -->
  <div id="deleteConfirmModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl p-5 space-y-4">
      <div class="flex items-center space-x-3 text-red-600">
        <i data-lucide="alert-triangle" class="w-6 h-6 shrink-0"></i>
        <h3 class="text-base font-bold text-gray-900">영수증 삭제</h3>
      </div>
      <p class="text-xs text-gray-600">해당 영수증 내역을 삭제하시겠습니까? 구글 드라이브 DB에서도 함께 삭제됩니다.</p>
      <div class="flex space-x-2 pt-1">
        <button type="button" id="btnCancelDelete" class="touch-btn flex-1 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold rounded-lg">취소</button>
        <button type="button" id="btnConfirmDelete" class="touch-btn flex-1 py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-semibold rounded-lg shadow">삭제하기</button>
      </div>
    </div>
  </div>

  <!-- 드라이브 설정 모달 -->
  <div id="configModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl p-5 space-y-4">
      <div class="flex items-center justify-between border-b pb-2">
        <h3 class="text-sm font-bold text-gray-900">구글 드라이브 Web App 연동 설정</h3>
        <button type="button" id="btnCloseConfig" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Google Apps Script Web App URL (/exec)</label>
        <input type="url" id="inputDriveUrl" placeholder="https://script.google.com/macros/s/.../exec" class="w-full px-3 py-2 border rounded-lg text-xs outline-none focus:ring-2 focus:ring-indigo-500" />
        <p class="text-[11px] text-gray-400 mt-1">※ 배포 시 액세스 권한을 반드시 '모든 사용자(Anyone)'로 지정해야 모바일에서 정상 동작합니다.</p>
      </div>
      <button type="button" id="btnSaveDriveUrl" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-lg shadow">설정 저장</button>
    </div>
  </div>

  <!-- 토스트 알림 바 -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-900/90 text-white text-xs px-4 py-2.5 rounded-full shadow-lg pointer-events-none transition-opacity duration-300 opacity-0 z-50 flex items-center space-x-1.5">
    <span id="toastMsg">알림 메시지</span>
  </div>

  <script>
    const STORAGE_KEY = 'corp_card_expenses_v2';
    const DRIVE_URL_KEY = 'corp_card_drive_url';

    let expenses = [];
    let pendingDeleteId = null;
    let base64ImageTemp = '';

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.innerText = msg;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2300);
    }

    function checkDriveUrl() {
      const url = localStorage.getItem(DRIVE_URL_KEY);
      const banner = document.getElementById('setupBanner');
      if (!url) {
        banner.classList.remove('hidden');
      } else {
        banner.classList.add('hidden');
      }
    }

    function loadLocalExpenses() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        expenses = raw ? JSON.parse(raw) : [];
      } catch (e) {
        expenses = [];
      }
      renderList();
    }

    function saveLocalExpenses() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
      } catch (e) {
        console.error('로컬 저장 실패', e);
      }
      renderList();
    }

    // 카드 목록 렌더링 (이벤트 위임을 위해 data-id 명시)
    function renderList() {
      const container = document.getElementById('expenseListContainer');
      const totalAmountText = document.getElementById('totalAmountText');
      const totalCountText = document.getElementById('totalCountText');

      if (!expenses || expenses.length === 0) {
        container.innerHTML = `
          <div class="p-8 text-center text-gray-400 text-sm bg-white rounded-xl border border-dashed border-gray-300">
            등록된 영수증 내역이 없습니다.
          </div>
        `;
        totalAmountText.innerText = '0원';
        totalCountText.innerText = '총 0건';
        lucide.createIcons();
        return;
      }

      let total = 0;
      container.innerHTML = expenses.map(item => {
        const amt = Number(item.amount) || 0;
        total += amt;
        const imgTag = item.imageUrl 
          ? `<a href="${item.imageUrl}" target="_blank" class="block shrink-0"><img src="${item.imageUrl}" class="w-14 h-14 rounded-lg object-cover border" alt="영수증" /></a>` 
          : `<div class="w-14 h-14 rounded-lg bg-gray-100 border flex items-center justify-center text-gray-400 shrink-0"><i data-lucide="receipt" class="w-6 h-6"></i></div>`;

        return `
          <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex items-start justify-between space-x-3">
            <div class="flex items-start space-x-3 overflow-hidden">
              ${imgTag}
              <div class="space-y-0.5 min-w-0">
                <div class="flex items-center space-x-1.5">
                  <span class="text-xs text-gray-400 font-medium">${item.date || ''}</span>
                  <span class="text-[10px] bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded font-medium">${item.category || '기타'}</span>
                </div>
                <h3 class="text-sm font-bold text-gray-900 truncate">${item.merchant || '미입력'}</h3>
                <p class="text-xs text-gray-500 truncate">${item.purpose || '-'}</p>
                <div class="text-sm font-extrabold text-indigo-600 pt-0.5">${amt.toLocaleString()}원</div>
              </div>
            </div>

            <div class="flex flex-col space-y-1.5 shrink-0">
              <button type="button" class="btn-item-edit touch-btn bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs px-2.5 py-1.5 rounded-lg flex items-center justify-center font-medium" data-id="${item.id}">
                <i data-lucide="pencil" class="w-3.5 h-3.5 mr-1 pointer-events-none"></i>수정
              </button>
              <button type="button" class="btn-item-delete touch-btn bg-red-50 hover:bg-red-100 text-red-600 text-xs px-2.5 py-1.5 rounded-lg flex items-center justify-center font-medium" data-id="${item.id}">
                <i data-lucide="trash-2" class="w-3.5 h-3.5 mr-1 pointer-events-none"></i>삭제
              </button>
            </div>
          </div>
        `;
      }).join('');

      totalAmountText.innerText = `${total.toLocaleString()}원`;
      totalCountText.innerText = `총 ${expenses.length}건`;
      lucide.createIcons();
    }

    // 이벤트 위임 방식으로 수정/삭제 버튼 제어
    document.getElementById('expenseListContainer').addEventListener('click', (e) => {
      const editBtn = e.target.closest('.btn-item-edit');
      if (editBtn) {
        e.preventDefault();
        const id = editBtn.getAttribute('data-id');
        openEditModal(id);
        return;
      }

      const deleteBtn = e.target.closest('.btn-item-delete');
      if (deleteBtn) {
        e.preventDefault();
        const id = deleteBtn.getAttribute('data-id');
        openDeleteModal(id);
        return;
      }
    });

    function openEditModal(id) {
      const target = expenses.find(x => String(x.id) === String(id));
      if (!target) {
        showToast('해당 영수증 내역을 찾을 수 없습니다.');
        return;
      }

      document.getElementById('editExpenseId').value = target.id;
      document.getElementById('inputDate').value = target.date || '';
      document.getElementById('inputMerchant').value = target.merchant || '';
      document.getElementById('inputAmount').value = target.amount || '';
      document.getElementById('inputCategory').value = target.category || '복리후생비(식대)';
      document.getElementById('inputUser').value = target.user || '';
      document.getElementById('inputPurpose').value = target.purpose || '';

      base64ImageTemp = target.imageUrl || '';
      const previewWrap = document.getElementById('receiptPreviewWrap');
      const previewImg = document.getElementById('receiptPreviewImg');
      if (base64ImageTemp) {
        previewImg.src = base64ImageTemp;
        previewWrap.classList.remove('hidden');
      } else {
        previewWrap.classList.add('hidden');
      }

      document.getElementById('modalTitle').innerText = '영수증 내역 수정';
      document.getElementById('expenseModal').classList.remove('hidden');
    }

    function openDeleteModal(id) {
      pendingDeleteId = id;
      document.getElementById('deleteConfirmModal').classList.remove('hidden');
    }

    // 이미지 파일 변환
    document.getElementById('inputReceiptFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        base64ImageTemp = evt.target.result;
        const previewWrap = document.getElementById('receiptPreviewWrap');
        const previewImg = document.getElementById('receiptPreviewImg');
        previewImg.src = base64ImageTemp;
        previewWrap.classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('btnRemoveImage').addEventListener('click', () => {
      base64ImageTemp = '';
      document.getElementById('inputReceiptFile').value = '';
      document.getElementById('receiptPreviewWrap').classList.add('hidden');
    });

    // 폼 저장 (신규 등록 및 수정)
    document.getElementById('expenseForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const editId = document.getElementById('editExpenseId').value;
      const expenseData = {
        id: editId || ('exp_' + Date.now()),
        date: document.getElementById('inputDate').value,
        merchant: document.getElementById('inputMerchant').value.trim(),
        amount: Number(document.getElementById('inputAmount').value) || 0,
        category: document.getElementById('inputCategory').value,
        user: document.getElementById('inputUser').value.trim(),
        purpose: document.getElementById('inputPurpose').value.trim(),
        imageUrl: base64ImageTemp || ''
      };

      if (editId) {
        expenses = expenses.map(x => String(x.id) === String(editId) ? expenseData : x);
        showToast('내역이 수정되었습니다.');
      } else {
        expenses.unshift(expenseData);
        showToast('새 영수증이 등록되었습니다.');
      }

      saveLocalExpenses();
      document.getElementById('expenseModal').classList.add('hidden');

      // 백그라운드 구글 드라이브 동기화
      postToDrive({ action: 'save', expense: expenseData });
    });

    // 삭제 실행
    document.getElementById('btnConfirmDelete').addEventListener('click', () => {
      if (!pendingDeleteId) return;

      const idToDelete = pendingDeleteId;
      expenses = expenses.filter(x => String(x.id) !== String(idToDelete));
      saveLocalExpenses();

      document.getElementById('deleteConfirmModal').classList.add('hidden');
      showToast('삭제되었습니다.');

      postToDrive({ action: 'delete', id: String(idToDelete) });
      pendingDeleteId = null;
    });

    document.getElementById('btnCancelDelete').addEventListener('click', () => {
      document.getElementById('deleteConfirmModal').classList.add('hidden');
      pendingDeleteId = null;
    });

    // 구글 드라이브 전송 함수
    async function postToDrive(payload) {
      const url = localStorage.getItem(DRIVE_URL_KEY);
      if (!url) return;

      try {
        await fetch(url, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.warn('드라이브 전송 지연:', err);
      }
    }

    // 구글 드라이브 전체 동기화 (doGet)
    document.getElementById('btnSyncDrive').addEventListener('click', async () => {
      const url = localStorage.getItem(DRIVE_URL_KEY);
      if (!url) {
        showToast('설정에서 Web App URL을 먼저 등록해주세요.');
        document.getElementById('configModal').classList.remove('hidden');
        return;
      }

      const spinner = document.getElementById('syncSpinner');
      spinner.classList.add('animate-spin');
      showToast('구글 드라이브에서 내역을 불러오는 중...');

      try {
        const fetchUrl = url + (url.includes('?') ? '&' : '?') + 't=' + Date.now();
        const res = await fetch(fetchUrl);
        const data = await res.json();

        if (Array.isArray(data)) {
          expenses = data;
          saveLocalExpenses();
          showToast(`동기화 완료: ${data.length}건을 불러왔습니다.`);
        } else if (data && data.error) {
          showToast('드라이브 오류: ' + data.error);
        } else {
          showToast('데이터 형식이 올바르지 않습니다.');
        }
      } catch (err) {
        console.error(err);
        showToast('동기화 실패: URL 및 배포 권한(Anyone)을 확인하세요.');
      } finally {
        spinner.classList.remove('animate-spin');
      }
    });

    // 엑셀 다운로드 (파일명: 법인카드 영수증_YYYY-MM.xlsx)
    document.getElementById('btnExportExcel').addEventListener('click', () => {
      if (!expenses || expenses.length === 0) {
        showToast('다운로드할 내역이 없습니다.');
        return;
      }

      const rows = expenses.map(item => ({
        '사용일자': item.date || '',
        '사용처': item.merchant || '',
        '결제금액': Number(item.amount) || 0,
        '계정과목': item.category || '',
        '결제자': item.user || '',
        '이용목적': item.purpose || '',
        '영수증링크': item.imageUrl || ''
      }));

      const worksheet = XLSX.utils.json_to_sheet(rows);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, '영수증내역');

      const now = new Date();
      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const filename = `법인카드 영수증_${yyyy}-${mm}.xlsx`;

      XLSX.writeFile(workbook, filename);
      showToast(`${filename} 다운로드 완료`);
    });

    // 신규 등록 모달 열기
    document.getElementById('btnOpenAddModal').addEventListener('click', () => {
      document.getElementById('expenseForm').reset();
      document.getElementById('editExpenseId').value = '';
      base64ImageTemp = '';
      document.getElementById('receiptPreviewWrap').classList.add('hidden');
      document.getElementById('inputDate').value = new Date().toISOString().substring(0, 10);
      document.getElementById('modalTitle').innerText = '새 영수증 등록';
      document.getElementById('expenseModal').classList.remove('hidden');
    });

    document.getElementById('btnCloseModal').addEventListener('click', () => {
      document.getElementById('expenseModal').classList.add('hidden');
    });
    document.getElementById('btnCancelModal').addEventListener('click', () => {
      document.getElementById('expenseModal').classList.add('hidden');
    });

    // 설정 모달 열기/저장
    const openConfig = () => {
      document.getElementById('inputDriveUrl').value = localStorage.getItem(DRIVE_URL_KEY) || '';
      document.getElementById('configModal').classList.remove('hidden');
    };
    document.getElementById('btnConfigDrive').addEventListener('click', openConfig);
    document.getElementById('btnBannerSetup').addEventListener('click', openConfig);

    document.getElementById('btnCloseConfig').addEventListener('click', () => {
      document.getElementById('configModal').classList.add('hidden');
    });
    document.getElementById('btnSaveDriveUrl').addEventListener('click', () => {
      const val = document.getElementById('inputDriveUrl').value.trim();
      localStorage.setItem(DRIVE_URL_KEY, val);
      document.getElementById('configModal').classList.add('hidden');
      checkDriveUrl();
      showToast('연동 URL이 저장되었습니다.');
    });

    // 캐시 삭제
    document.getElementById('btnClearCache').addEventListener('click', () => {
      if (confirm('로컬 임시 캐시를 삭제하시겠습니까? 구글 드라이브 원본 데이터는 유지됩니다.')) {
        localStorage.removeItem(STORAGE_KEY);
        expenses = [];
        renderList();
        showToast('로컬 캐시가 삭제되었습니다.');
      }
    });

    // 초기 실행
    document.addEventListener('DOMContentLoaded', () => {
      checkDriveUrl();
      loadLocalExpenses();
      // URL이 등록되어 있다면 실행 시 자동 동기화 시도
      if (localStorage.getItem(DRIVE_URL_KEY)) {
        document.getElementById('btnSyncDrive').click();
      }
    });
  </script>
</body>
</html>
